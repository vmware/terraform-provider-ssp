---
name: docs-lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Docs Lint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          config: '.markdownlint.jsonc'
          globs: |
            docs/*.md
            docs/data-sources/*.md
            docs/guides/*.md
            docs/resources/*.md
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version-compatibility docs are in sync
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          make docs-compat
          git diff --exit-code -- docs/guides/version-compatibility.md README.md || {
            echo "::error title=Compatibility docs out of sync::docs/guides/version-compatibility.md and/or README.md don't match internal/compat/compatibility.yaml. Run 'make docs-compat' and commit the result."
            exit 1
          }
