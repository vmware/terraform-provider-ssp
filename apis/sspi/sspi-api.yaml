    WorkflowStatus:
      title: Workflow Status
      description: The security service workflow status.
      type: object
      additionalProperties: false
      properties:
        platform_id:
          type: string
          title: ID of the SSP instance.
          description: The ID of the SSP instance.
        platform_name:
          type: string
          title: Name of the SSP instance.
          description: The name of the SSP instance.
        phase:
          type: string
          title: Workflow Phase
          description: |
            The current phase of the workflow.
            - DRAFT: The starting phase.
            - PRECHECK: The phase where the deployment precheck takes place.
            - DEPLOYMENT: The phase where the deployment takes place.
            - DELETE: The phase for cleanup platform tasks after completion.
            - UPDATE_PRECHECK: The phase where the update platform precheck takes place after deployment.
            - UPDATE: The phase where the update platform takes place after deployment.
          enum:
            - DRAFT
            - PRECHECK
            - DEPLOYMENT
            - DELETE
            - UPDATE_PRECHECK
            - UPDATE
        workflow_results:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowResult'
          title: Workflow Results
          description: A list of workflow results.

    WorkflowResult:
      title: Workflow Result
      description: The security service workflow results.
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          title: Workflow Name
          description: The name of the workflow.
        type:
          type: string
          title: Workflow Type
          description: The type of the workflow.
          enum:
           - PLATFORM_DEPLOYMENT
           - PLATFORM_DELETE
           - PLATFORM_DEPLOYMENT_PRECHECK
           - CONFIG_UPDATE
           - CONFIG_UPDATE_PRECHECK
           - PROVIDER_UPDATE
        start_time:
          $ref: '#/components/schemas/EpochMsTimestamp'
        end_time:
          $ref: '#/components/schemas/EpochMsTimestamp'
        state:
          type: string
          title: Workflow State
          description: The current status of the workflow.
          enum: [ "UNKNOWN", "NOT_STARTED", "QUEUED", "RUNNING", "STOPPING", "STOPPED", "FAILED",
                  "ROLLBACK_QUEUED", "ROLLBACK_RUNNING", "ROLLBACK_STOPPING", "ROLLBACK_STOPPED", "ROLLBACK_FAILED",
                  "ROLLBACK_COMPLETED", "ABORTED", "COMPLETED" ]
        phase:
          type: string
          title: Workflow Phase
          description: The current phase of the workflow.
          enum: [ "DRAFT", "EXECUTE", "COMPLETE", "DELETE" ]
        jobs:
          type: array
          title: Workflow Jobs
          items:
            $ref: '#/components/schemas/JobResult'
          description: A list of job states that belong to this workflow.

    JobResult:
      title: Job Result
      description: The security service task results.
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          title: Job ID
          description: The ID of the job.
        display_name:
          type: string
          title: Job Name
          description: The name of the job.
        details:
          type: string
          title: Job Details
