      - type: object
        required:
          - server
          - user
          - password
          - certificate
        properties:
          server:
            type: string
            title: IP or FQDN of the vSphere
            description: The IP or FQDN of the vSphere.
          user:
            type: string
            title: User for vSphere with Administrative Access
            description: A user for vSphere with administrative access.
          password:
            type: string
            format: password
            title: Password for vSphere User
            description: The password for the vSphere user. This field should be masked for read access.
            writeOnly: true
          certificate:
            title: PEM-Encoded Certificate for the vCenter
            description: |
              The PEM-encoded certificate for the vCenter.
            type: string
            writeOnly: true
          state:
            title: JSON-Encoded Additional Metadata About the Provider
            description: |
              JSON-encoded additional metadata about the provider.
            type: string
            readOnly: true
          instance_id:
            title: Instance ID
            description: The instance ID of the vSphere provider in the Security Service Platform Installer.
            type: string
            readOnly: true

    ProviderConnectionStatus:
      title: Provider Connection Status
      description: The provider connection status.
      type: object
      additionalProperties: false
      required:
        - message
        - state
      properties:
        message:
          type: string
          title: Summary of Connection Status
          description: A summary of the connection status.
        state:
          $ref: '#/components/schemas/ProviderConnectionStatusEnum'

    ProviderConnectionStatusEnum:
      title: Provider Connection Status Enum
      description: Enum for the provider connection status.
      type: string
      enum: [CONNECTED, NOT_CONNECTED]

    GlobalSettings:
      title: Global secop settings
      description: The global settings for secop. This is a read-only response schema.
      type: object
      additionalProperties: false
      properties:
        max_controller_node:
          type: integer
          format: int64
          title: Max Supported Controller Nodes
          description: This is the max number of controller nodes supported.
          readOnly: true
        min_controller_node:
          type: integer
          format: int64
          title: Minimum Supported Controller Nodes
          description: This is the minimum number of controller nodes supported.
          readOnly: true
        max_worker_node:
          type: integer
          format: int64
          title: Max Supported Worker Nodes
          description: This is the max number of worker nodes supported.
          readOnly: true
        min_worker_node:
          type: integer
          format: int64
          title: Minimum Supported Worker Nodes
          description: This is the minimum number of worker nodes supported.
          readOnly: true
        min_node_ip_pool_count:
          type: integer
          format: int64
          title: Minimum Node IP Pool Count
          description: |
            The minimum number of IPs required in the Node IP Pool. Calculated as:
            2 (1 for VIP + 1 for rolling upgrade) + controller_count + worker_count.
            Uses min_worker_nodes if worker_count query parameter is not provided.
          readOnly: true
        min_service_ip_pool_count:
          type: integer
          format: int64
          title: Minimum Service IP Pool Count
          description: |
            The minimum number of IPs required in the Service IP Pool. Calculation varies by deployment:
            - Licensing/AVI Operations/Evaluation: 3 IPs (1 Contour + 1 kafka-external + 1 kafka broker)
            - Medium: 5 IPs (1 Contour + 1 kafka-external + 3 kafka brokers hardcoded)
            - Large/Extra-Large: 3 + ceil(worker_count/2) for extra kafka brokers
            Uses min_worker_nodes if worker_count query parameter is not provided.
          readOnly: true

    ProviderStatus:
      title: Provider Status
      description: |
        The comprehensive status of the provider, including both connection status
        and provider realization workflow status.
      type: object
      additionalProperties: false
      properties:
        provider_id:
          type: string
          title: ID of the Provider
          description: The ID of the provider.
        connection_status:
          $ref: '#/components/schemas/ProviderConnectionStatus'
        workflow_results:
          $ref: '#/components/schemas/WorkflowResult'

    # Extend common BackupConfig with ManagedResource
    BackupConfig:
      title: Remote backup server configuration
      description: SFTP target host, credentials, and folder where backup bundles are stored.
      allOf:
        - $ref: '#/components/schemas/ManagedResource'
        - type: object
          title: Connection details for the backup repository
          description: Required fields define where the installer writes backups.
          required:
            - server_address
            - protocol
            - port
            - username
            - backup_location
            - ssh_public_key
            - password
          properties:
            server_address:
              title: Server Address
              type: string
              maxLength: 255
              description: FQDN or IP address of backup server
            protocol:
              title: Protocol
              type: string
              enum:
                - SFTP
              description: File transfer protocol supported by backup server
            port:
              title: Port
              type: integer
              minimum: 1
              maximum: 65535
              description: Configured port for proxy
            username:
              title: Username
              type: string
              description: User name for ssh access to file server
              minLength: 3
              maxLength: 30
            ssh_public_key:
              title: SSH Public Key
              type: string
              description: The SSH public key of the file server
            backup_location:
              title: Backup Location
              type: string
              description: Directory in backup server
            password:
              title: Password
              type: string
              format: password
              writeOnly: true
              minLength: 6
              maxLength: 255
              description: Password for file server authentication
            passphrase:
              title: Passphrase
              type: string
              format: password
              writeOnly: true
              description: Passphrase to secure backup bundle file
              minLength: 12
              maxLength: 255

    # RecurringBackupConfig with ManagedResource
    RecurringBackupConfig:
      title: Scheduled (recurring) backup policy
      description: Whether automated backups run, full backup type, and weekly or interval schedule.
      allOf:
        - $ref: '#/components/schemas/ManagedResource'
        - type: object
          title: Automated backup schedule
          description: When enabled, backups run on the configured weekly or interval schedule.
          required:
            - enabled
            - backup_type
            - backup_schedule_type
          properties:
            enabled:
              title: Enabled
              type: boolean
              description: Flag to indicate automated backups are enabled or not
            backup_type:
              $ref: '#/components/schemas/BackupType'
            backup_schedule_type:
              $ref: '#/components/schemas/BackupScheduleType'
            backup_schedule_weekly:
              $ref: '#/components/schemas/WeeklyBackupSchedule'
            backup_schedule_interval:
              $ref: '#/components/schemas/IntervalBackupSchedule'

    BackupScheduleType:
      title: Backup Schedule Type
      type: string
      enum:
        - WEEKLY
        - INTERVAL
      description: WEEKLY uses calendar days and time; INTERVAL uses hours between runs.

    WeeklyBackupSchedule:
      title: Weekly Backup Schedule
      type: object
      required:
        - days_of_week
      description: Days of week and local time when a WEEKLY scheduled backup runs.
      properties:
        days_of_week:
          title: Days Of Week
          description: Days of week when backup is taken. Sunday, Monday, Tuesday...
          type: array
          items:
            $ref: '#/components/schemas/WeekDay'
          uniqueItems: true
          minItems: 1
          maxItems: 7
        hour_of_day:
          title: Hour Of Day
          description: Hour of day when backup is taken
          type: integer
          minimum: 0
          maximum: 23
          default: 0
        minute_of_day:
          title: Minute Of Day
          description: Minute of hour when backup is taken
          type: integer
          minimum: 0
          maximum: 59
          default: 0

    WeekDay:
      title: Week Day
      type: string
      enum:
        - SUNDAY
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
      description: Calendar weekday for weekly schedules.

    IntervalBackupSchedule:
      title: Interval Backup Schedule
      type: object
      description: Hours between starts when using INTERVAL schedule type.
      properties:
        hours_between_backups:
          title: Hours Between Backups
          description: Time interval in hours between two consecutive automated backups
          type: integer
          minimum: 6
          maximum: 720
          default: 168

    BackupTriggerType:
      title: Backup Trigger Type
      type: string
      enum:
        - MANUAL
        - SCHEDULER
        - AUTOMATIC
      description: Whether the backup was started manually or by automation.

    BackupType:
      title: Backup Type
      type: string
      enum:
        - FULL_BACKUP
      description: Backup scope; FULL_BACKUP is the supported type for this API.

    BackupAction:
      title: Backup Action
      type: string
      enum:
        - BACKUP
      description: Must be BACKUP for starting a backup job.

    RestoreAction:
      title: Restore Action
      type: string
      enum:
        - RESTORE
      description: Must be RESTORE for starting a restore job.

    BackupRequest:
      title: Start Backup Request
      type: object
      additionalProperties: false
      description: Body for POST /sspi/backup; requires backup_type and action BACKUP.
      required:
        - backup_type
        - action
      properties:
        id:
          title: Id
          type: string
          description: Unique id for backup
        name:
          title: Name
          type: string
          description: Backup name
          maxLength: 255
        description:
          title: Description
          type: string
          description: Backup description
          maxLength: 255
        backup_type:
          $ref: '#/components/schemas/BackupType'
          description: Backup type for what to take in backup
        action:
          $ref: '#/components/schemas/BackupAction'
          description: Type of backup action

    BackupRestoreStatus:
      title: Backup/Restore Status
      type: string
      enum:
        - SUCCESS
        - FAILED
        - IN_PROGRESS
        - QUEUED
        - NOT_STARTED
        - COMPLETED_WITH_ERRORS
      description: Lifecycle state of a backup or restore job.

    BackupStatus:
      title: Backup job status
      description: Progress, timestamps, version, and per-entity results for one backup job.
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          required:
            - id
            - backup_type
            - backup_trigger_type
            - status
            - version
            - error_messages
            - no_of_entities
            - entities_status
          properties:
            backup_start_time:
              $ref: '#/components/schemas/EpochMsTimestamp'
              description: Milliseconds since Unix epoch when the backup started (EpochMsTimestamp).
              readOnly: true
            backup_end_time:
              $ref: '#/components/schemas/EpochMsTimestamp'
              description: Milliseconds since Unix epoch when the backup completed (EpochMsTimestamp).
              readOnly: true
            progress:
              title: Progress
              type: integer
              description: Backup progress, expressed as a percentage from 0 to 100, inclusive
              readOnly: true
            progress_message:
              title: Progress Message
              type: string
              description: Backup progress message
              readOnly: true
            backup_type:
              $ref: '#/components/schemas/BackupType'
            backup_trigger_type:
              $ref: '#/components/schemas/BackupTriggerType'
              readOnly: true
            status:
              $ref: '#/components/schemas/BackupRestoreStatus'
              readOnly: true
            file_size:
              title: File Size
              type: integer
              description: Backup file size
              readOnly: true
            version:
              title: Version
              type: string
              description: Deployed version this backup is taken
              readOnly: true
            error_messages:
              title: Error Messages
              type: array
              description: List of error messages encountered during backup operation
              items:
                type: string
              readOnly: true
            no_of_entities:
              title: No Of Entities
              description: number of managed entities
              type: integer
              format: int32
              readOnly: true
            entities_status:
              title: Entities Status
              type: array
              description: Status of backup operation for each managed entity
              items:
                $ref: '#/components/schemas/BackupRestoreManagedEntityStatus'
              readOnly: true

    BackupStatusList:
      title: Backup Status List
      description: |
        Paginated list of backup jobs (see ListResult for paging fields).
      allOf:
        - $ref: '#/components/schemas/ListResult'
        - type: object
          required:
            - result
          properties:
            result:
              title: Result
              type: array
              description: List of backup status records
              items:
                $ref: '#/components/schemas/BackupStatus'
              readOnly: true

    RestoreRequest:
      title: Start Restore Request Common
      type: object
      additionalProperties: false
      description: Body for POST /sspi/restore; requires backup_id and action RESTORE.
      required:
        - backup_id
        - action
      properties:
        id:
          title: Id
          type: string
          description: Unique id of restore
        name:
          title: Name
          type: string
          description: Backup name
          maxLength: 255
        description:
          title: Description
          type: string
          description: Backup description
          maxLength: 255
        backup_id:
          title: Backup Id
          type: string
          description: Unique id of successful backup
        force_restore:
          title: Force Restore
          type: boolean
          default: false
          description: |-
            Bypasses validation pre-checks during the restore operation. If true, the
            system ignores recoverable errors that would otherwise block the restore
        action:
          $ref: '#/components/schemas/RestoreAction'

    RestoreStatus:
      title: Restore job status
      description: Progress, timestamps, source backup reference, and per-entity results for one restore job.
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          required:
            - id
            - backup_id
            - backup_start_time
            - status
            - version
            - error_messages
            - no_of_entities
            - entities_status
          properties:
            backup_id:
              title: Backup Id
              type: string
              description: Unique id of backup
              readOnly: true
            backup_name:
              title: Backup Name
              type: string
              description: Backup name
              readOnly: true
            backup_start_time:
              $ref: '#/components/schemas/EpochMsTimestamp'
              description: Milliseconds since Unix epoch when the source backup started (EpochMsTimestamp).
              readOnly: true
            restore_start_time:
              $ref: '#/components/schemas/EpochMsTimestamp'
              description: Milliseconds since Unix epoch when the restore started (EpochMsTimestamp).
              readOnly: true
            restore_end_time:
              $ref: '#/components/schemas/EpochMsTimestamp'
              description: Milliseconds since Unix epoch when the restore completed (EpochMsTimestamp).
              readOnly: true
            progress:
              title: Progress
              type: integer
              description: Restore progress, expressed as a percentage from 0 to 100, inclusive
              readOnly: true
            progress_message:
              title: Progress Message
              type: string
              description: Restore progress message
              readOnly: true
            status:
              $ref: '#/components/schemas/BackupRestoreStatus'
              description: Status of restore request
              readOnly: true
            version:
              title: Version
              type: string
              description: Deployed version of the backup used in this restore
              readOnly: true
            error_messages:
              title: Error Messages
              type: array
              description: List of error messages encountered during restore operation
              items:
                type: string
              readOnly: true
            no_of_entities:
              title: No Of Entities
              description: number of managed entities
              type: integer
              format: int32
              readOnly: true
            entities_status:
              title: Entities Status
              type: array
              description: Status of restore operation for each managed entity
              items:
                $ref: '#/components/schemas/BackupRestoreManagedEntityStatus'
              readOnly: true
            backup_location:
              title: Backup Location
              type: string
              description: Directory in backup server where the backup was stored
              readOnly: true
            server_address:
              title: Server Address
              type: string
              description: FQDN or IP address of the backup server
              readOnly: true

    RestoreStatusList:
      title: Restore Status List
      description: |
        Paginated list of restore jobs (see ListResult for paging fields).
      allOf:
        - $ref: '#/components/schemas/ListResult'
        - type: object
          required:
            - result
          properties:
            result:
              title: Result
              type: array
              description: List of restore status records
              items:
                $ref: '#/components/schemas/RestoreStatus'
              readOnly: true

    BackupHistoryType:
      title: Backup/Restore History Type
      type: string
      enum:
        - DB
        - SERVER
      description: DB reads job history from the database; SERVER reconciles with the remote backup server view.

    BackupDetails:
      title: Extended backup metadata
      description: Snapshot of backup identity, trigger, version, and SSP instance details at backup time.
      type: object
      properties:
        backup_id:
          title: Backup ID
          type: string
          description: Unique id of backup
        description:
          title: Description
          type: string
          description: Backup description
        trigger_type:
          title: Trigger Type
          type: string
          description: Backup triggered type
        version:
          title: Version
          type: string
          description: Deployed version of SSPI
        instancesDetails:
          title: Instances Details
          description: |
            Details of SSP instances deployed by this SSPI at the time
            the backup was taken
          type: array
          items:
            $ref: "#/components/schemas/SspDetails"

    SspDetails:
      title: SSP instance details at backup time
      description: |
        One SSP instance as deployed when the backup was taken (names, versions, pools, endpoints).
      type: object
      properties:
        instance:
          title: Instance
          type: string
          description: SSP instance name
        atp_version:
          title: ATP Version
          type: string
          description: Deployed version of SSP
        form_factor:
          title: Form Factor
          $ref: '#/components/schemas/FormFactor'
        controller_count:
          title: Controller Count
          type: integer
          description: Number of controller nodes
        worker_count:
          title: Worker Count
          type: integer
          description: Number of worker nodes
        node_pool:
          title: Node Pool
          description: node ip pools
          type: array
          items:
            $ref: "#/components/schemas/IpPool"
        service_pool:
          title: Service Pool
          description: service ip pools
          type: array
          items:
            $ref: "#/components/schemas/IpPool"
        ingress_fqdn:
          title: Ingress FQDN
          description: FQDN of security service platform
          type: string
        kafka_fqdn:
          title: Kafka FQDN
          description: FQDN of the kafka running in security service platform
          type: string

    BackupRestoreManagedEntityStatus:
      title: Managed entity backup or restore outcome
      description: Per-component status and errors for one entity in a backup or restore job.
      type: object
      required:
        - id
        - name
        - form_factor
        - status
        - error_messages
      properties:
        id:
          title: ID
          type: string
          description: Unique managed entity ID
        name:
          title: Name
          type: string
          description: Unique entity name
        form_factor:
          $ref: '#/components/schemas/FormFactor'
        status:
          title: Status
          $ref: '#/components/schemas/BackupRestoreStatus'
        error_messages:
          title: Error Messages
          type: array
          description: Error messages pertaining to backup operation on this endpoint
          items:
            type: string
