          description: The current status of the job.
          enum: [ "UNKNOWN", "NOT_STARTED", "QUEUED", "RUNNING", "STOPPING", "STOPPED", "FAILED",
                  "ROLLBACK_QUEUED", "ROLLBACK_RUNNING", "ROLLBACK_STOPPING", "ROLLBACK_STOPPED", "ROLLBACK_FAILED",
                  "ROLLBACK_COMPLETED", "ABORTED", "COMPLETED_WITH_WARNING", "COMPLETED" ]

