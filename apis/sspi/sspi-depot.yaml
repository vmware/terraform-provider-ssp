openapi: 3.0.3
info:
  title: SSPI Depot API
  version: 1.0.0
tags:
  - name: depot
    description: Security Services Platform Installer Depot API
paths:
  /sspi/bundles/{id}:
    get:
      tags:
        - depot
      description: Get information of an uploaded bundle by ID
      summary: Get information of an uploaded bundle by ID
      operationId: GetBundle
      security:
        - enterprise_admin: []
        - auditor: []
      parameters:
        - name: id
          in: path
          schema:
            type: string
            description: ID of the uploaded bundle
            title: Bundle ID
          description: ID of the uploaded bundle
      responses:
        "200":
          description: Get information of an uploaded bundle by ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - depot
      description: Delete an uploaded bundle or cancel a bundle upload process by ID
      summary: Delete an uploaded bundle or cancel a bundle upload process by ID
      operationId: DeleteBundle
      security:
        - enterprise_admin: []
      parameters:
        - name: id
          in: path
          schema:
            type: string
            description: ID of the uploaded bundle
            title: Bundle ID
          description: ID of the uploaded bundle
      responses:
        "200":
          description: Successful bundle removal or bundle upload process cancellation
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sspi/bundles:
    get:
      tags:
        - depot
      description: Get a list of bundles
      summary: Get a list of bundles
      operationId: GetBundles
      security:
        - enterprise_admin: []
        - auditor: []
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortAscending'
        - $ref: '#/components/parameters/SortBy'
      responses:
        "200":
          description: Get information about bundles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBundles'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sspi/bundles/remote:
    post:
      tags:
        - depot
      description: Upload a bundle by providing a remote bundle URL
      summary: Upload a bundle by providing a remote bundle URL
      operationId: UploadRemoteBundle
      security:
        - enterprise_admin: []
      parameters:
        - $ref: '#/components/parameters/BundleTypeFilter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteUpload'
      responses:
        "202":
          description: |-
            Received the remote bundle URL and
            accepted the remote bundle upload request.
            The status URL of AsyncApiResponse will point to
            the newly created bundle resource.
            The URL endpoint will be /sspi/bundles/{id},
            in the response body, it contains the bundle downloading
            status and progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncApiResponse'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sspi/bundles/local:
    post:
      tags:
        - depot
      description: Upload a bundle by providing a local bundle file
      summary: Upload a bundle by providing a local bundle file
      operationId: UploadLocalBundle
      x-large-file-upload: true
      security:
        - enterprise_admin: []
      parameters:
        - $ref: '#/components/parameters/BundleTypeFilter'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LocalUpload'
      responses:
        "202":
          description: |-
            Received the local bundle file and
            finished the local bundle upload request.
            The status URL of AsyncApiResponse will point to
            the newly created bundle resource.
            The URL endpoint will be /sspi/bundles/{id},
            in the response body, it contains the bundle downloading
            status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncApiResponse'
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sspi/depot/health:
    get:
      tags:
        - depot
      description: Check depot health status
      summary: Check depot health status
      operationId: GetDepotHealth
      security:
        - enterprise_admin: []
        - auditor: []
      responses:
        "204":
          description: If 204 is returned, it means the depot is up and healthy.
        default:
          description: 4XX and 5XX type errors with appropriate message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    BundleTypeFilter:
      name: type
      in: query
      schema:
        $ref: "#/components/schemas/BundleType"
      description: Parameter to filter the bundles by type
    Offset:
      name: offset
      in: query
      description: Number of items to skip before starting to collect the result set.
      schema:
        type: integer
        default: 0
    PageSize:
      name: pageSize
      in: query
      description: The numbers of items to return.
      schema:
        type: integer
        default: 10
    SortAscending:
      name: sortAscending
      in: query
      description: Sort the items by Ascending (true) or Descending (false).
      schema:
        type: boolean
        default: true
    SortBy:
      name: sortBy
      in: query
      description: Sort the items by a specific field.
      schema:
        type: string
        default: "id"

  schemas:
    AsyncApiResponse:
      title: Async API Response
      description: Response returned for asynchronous operations.
      type: object
      properties:
        id:
          type: string
          description: Workflow or job ID.
        status_url:
          type: string
          description: URL to poll for status.

    ListResult:
      title: List Result
      description: Base pagination fields.
      type: object
      properties:
        cursor:
          type: string
        result_count:
          type: integer

    EpochMsTimestamp:
      type: integer
      format: int64
      description: Milliseconds since Unix epoch.

    Error:
      title: Error
      description: API error response format.
      type: object
      properties:
        error_code:
          type: integer
        error_message:
          type: string
        details:
          type: array
          items:
            type: string

    ListBundles:
      title: List of bundles
      description: List of bundles
      type: object
      allOf:
        - $ref: '#/components/schemas/ListResult'
        - type: object
          properties:
            results:
              description: List of SSPI bundles.
              type: array
              items:
                $ref: '#/components/schemas/Bundle'

    ManagedResource:
      title: Managed Resource
      description: Common fields for managed resources.
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the resource.
          readOnly: true
        created_at:
          type: string
          format: date-time
          description: Resource creation time.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Resource last update time.
          readOnly: true

    RemoteUpload:
      title: Remote bundle URL configuration
      description: Provide the remote bundle URL for the depot to download and store in the registry
      type: object
      required:
        - url
      properties:
        url:
          title: Remote bundle URL
          type: string
          description: Remote bundle URL
      example:
        url: "https://example.com/resources/bundle.tar"
      additionalProperties: false
    LocalUpload:
      title: Local Upload
      description: Provide the local bundle file for the depot to receive and store in the registry
      type: object
      required:
        - file
      properties:
        file:
          title: Local bundle file
          type: string
          format: binary
          description: Local bundle file.
      additionalProperties: false
    BundleType:
      type: string
      enum:
        - PLATFORM
        - INSTALLER
        - PLATFORM_PATCH
        - LICENSE
        - LICENSE_PATCH
        - AVI_OPERATIONS
        - AVI_OPERATIONS_PATCH
        - BMS
        - SVM
      title: Bundle Type
      description: Type of the bundle
      readOnly: true
    BundleStatus:
      type: string
      enum:
        - IN_PROGRESS
        - READY
        - IN_USE
        - ATTACHED
        - CANCELLED
        - ERROR
        - FAILED
      title: Bundle Status
      description: Status of the bundle
      readOnly: true
    Bundle:
      title: Bundle information
      description: Information about a bundle.
      allOf:
        - $ref: '#/components/schemas/ManagedResource'
        - type: object
          required:
            - bundle_version
            - size
            - bundle_type
            - packaged_time
            - status
            - progress
            - message
            - addons
          properties:
            bundle_version:
              type: string
              title: Bundle Version
              readOnly: true
              description: Version of the bundle
            size:
              type: integer
              title: Bundle Size
              readOnly: true
              description: Size of the bundle in bytes
            bundle_type:
              $ref: '#/components/schemas/BundleType'
            parent_id:
              type: string
              title: Parent Bundle id
              readOnly: true
              description: For patch bundles, the id of the base bundle
            packaged_time:
              $ref: '#/components/schemas/EpochMsTimestamp'
            status:
              $ref: '#/components/schemas/BundleStatus'
            progress:
              type: integer
              readOnly: true
              title: Bundle Progress
              description: Bundle upload progress in percentage, 0-100
            message:
              type: string
              readOnly: true
              title: Bundle Message
              description: Message related to the bundle upload
            addons:
              type: array
              items:
                $ref: '#/components/schemas/AddonBundle'
              title: Included bundle add-ons.
              description: List of add-on bundles.
          example:
            bundle_version: 5.0.0.0.0.12345678
            status: READY
            bundle_type: PLATFORM
            packaged_time: 17198592000
            progress: 100
            size: 25000000
            message: "uploading is done."
            addons: []
      type: object
      additionalProperties: false
    AddonBundle:
      title: Add-on bundle information
      description: Information about an add-on bundle.
      allOf:
        - type: object
          required:
            - id
            - bundle_version
            - bundle_type
            - description
            - required
          properties:
            id:
              type: string
              title: Bundle ID
              readOnly: true
              description: ID of the bundle.
            bundle_version:
              type: string
              title: Bundle Version
              readOnly: true
              description: Version of the bundle.
            bundle_type:
              $ref: '#/components/schemas/BundleType'
            description:
              type: string
              readOnly: true
              title: Bundle Description
              description: Description of bundle contents.
            required:
              type: boolean
              title: Add-on requiredness
              readOnly: true
              description: Whether the bundle is mandatory to consume.
          example:
            id: 0c9c4f22-6f54-4ca3-96bc-34db7f5c6111
            bundle_version: 5.2.0.0.0.23456789
            bundle_type: SVM
            description: "Service VM Add-on for the SSP 5.2 release"
      type: object
      additionalProperties: false
