  /ssp/lcm/features/{feature}:
    put:
      tags:
      - platform-features
      - feature-lifecycle
      summary: Submit a deployment action for a platform feature
      description: 'Queues an asynchronous deployment workflow for one platform feature,
        for example Security Intelligence.


        **Actions:**

        - `RUN_PRECHECK`: Run pre-flight validation checks against the feature configuration

        - `DEPLOY`: Execute pre-flight validation checks and deploy the feature using
        the staged configuration

        - `UNDEPLOY`: Remove the deployed feature (fails if dependencies exist)

        - `FORCE_UNDEPLOY`: Forcefully remove the deployed feature and cascade delete
        dependencies


        **Chain:** Asynchronous Polling: To monitor the progress of a feature operation,
        poll GET /lcm/features/{feature}/status.

        Ongoing operations return a 202 Accepted response formatted as an AsyncApiResponse.
        Clients should retain the response id for

        activity correlation and continue polling the provided status_url until the
        operation concludes.


        **Notes:**

        * Do not treat a ''202'' Accepted status as a completed operation. It strictly
        indicates that the background task has been queued and requires subsequent
        polling.

        * Concurrency conflicts yield a ''412'' status. Resolve this by fetching the
        latest resource, merging your payload updates, and submitting a new request
        with the updated _revision token.


        See Endpoint Guide for route comparison and workflow.

        '
      operationId: ManageSspFeatureDeployment
      parameters:
      - in: path
        name: feature
        required: true
        description: 'Platform feature key to manage. Values are case-sensitive and
          listed in the `SspFeature` schema.

          For example `INTELLIGENCE` corresponds to Security Intelligence.

          '
        schema:
          $ref: '#/components/schemas/SspFeature'
      requestBody:
        required: true
        description: 'Deployment command body: required `_revision` from GET, plus
          `action`. Named examples include sample payloads.

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SspFeatureDeployment'
            examples:
              run_precheck:
                summary: Run pre-checks only
                description: Validates prerequisites without deploying.
                value:
                  _revision: 3
                  action: RUN_PRECHECK
              deploy:
                summary: Deploy or activate the feature
                description: Runs pre-checks then proceeds with deployment when validation
                  succeeds.
                value:
                  _revision: 5
                  action: DEPLOY
              undeploy:
                summary: Remove the feature
                description: Standard removal, fails if dependents still reference
                  the feature.
                value:
                  _revision: 2
                  action: UNDEPLOY
              force_undeploy:
                summary: Force-remove the feature
                description: Use when cascade removal of dependents is required after
                  a blocked UNDEPLOY.
                value:
                  _revision: 2
                  action: FORCE_UNDEPLOY
      responses:
        '202':
          description: 'The deployment action has been successfully queued for background
            processing. To monitor the live execution state, poll GET /lcm/features/{feature}/status.
            Clients should extract and retain any asynchronous identifiers provided
            in the response envelope to correlate with system activity logs.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncApiResponse'
              example:
                id: 8f7e7db8-9c4a-4f2e-a501-7c4f8d6e2b11
                status_url: /ssp/lcm/features/INTELLIGENCE/status
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: 'An error occurred while processing the request. This could
            be due to authentication issues,

            authorization failures, invalid requests, precondition failures (such
            as revision mismatch),

            or internal server errors.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
    get:
      tags:
      - platform-features
      - feature-lifecycle
      summary: Retrieve staged deployment settings for a feature.
      description: '> Retrieves the persisted deployment request (intended action
        and revision) for the specified feature.

        Note that this returns the staged configuration, not the live runtime state.

        To view live execution metrics - such as the current deployment phase, pre-check
        results, and overall progress - use GET /lcm/features/{feature}/status.


        **Chain:** Issue this before PUT when sending `_revision`, unless the client
        already holds a fresh copy.


        See Endpoint Guide for route comparison and workflow.

        '
      operationId: GetSspFeatureDeployment
      parameters:
      - in: path
        name: feature
        required: true
        description: 'Platform feature key (case-sensitive). See `SspFeature`; for
          example `INTELLIGENCE` for Security Intelligence.

          '
        schema:
          $ref: '#/components/schemas/SspFeature'
      responses:
        '200':
          description: 'Current staged deployment resource for the feature, including
            generation for concurrency control.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SspFeatureDeployment'
              example:
                _revision: 4
                action: DEPLOY
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
