      description: "Update the site settings for activated SSP features for a specific\
        \ site. These settings are created and configured\nduring the onboarding workflow.\
        \ Configuring settings here DOES NOT control the deployment or undeployment\
        \ of the \nfeature on the platform, it only configures the feature settings\
        \ for a feature for this specific site.\n\n**Notes:**\n* Although all site\
        \ feature settings are returned, not all of the settings are editable via\
        \ API.\n"
      operationId: UpdateSiteFeatureSettings
      parameters:
      - in: path
        required: true
        name: site-id
        schema:
          type: string
        description: The site ID for which feature settings are being updated.
      requestBody:
        required: true
        description: The desired feature settings for the site.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteFeatureSettings'
            example:
              _revision: 0
              is_metrics_enabled: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteFeatureSettings'
              example:
                _resource_type: SiteFeatureSettings
                _revision: 0
                id: 2dc09816-34c0-43fb-99a6-b19b249a43da
                site_ids:
                - 2dc09816-34c0-43fb-99a6-b19b249a43da
                is_intelligence_enabled: false
                is_metrics_enabled: true
                is_mps_enabled: false
                is_ndr_enabled: false
                is_rule_analysis_enabled: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_code: 200001
                error_message: An internal server error occurred.
                module_name: site
      tags:
      - site-service
      security:
      - enterprise_admin: []
  /ssp/licensing-client/licenses:
