      example:
        _create_time: 1733750000000
        _create_user: admin
        _last_modified_time: 1733750000000
        _last_modified_user: admin
        _resource_type: NdrConfiguration
        _revision: 1
        _system_owned: false
        display_name: NDR Configuration
        data_sharing: true
    NdrParameters:
      title: NDR Parameters
      description: 'Configuration parameters for NSX NDR (Network Detection and Response).

        '
      type: object
      properties:
        data_sharing:
          title: Data Sharing
          description: 'Boolean flag to control whether NDR will share detection data

            to the cloud for enhanced threat intelligence.

            '
          type: boolean
          default: false
          example: true
    NdrConfigurationStatus:
      title: NDR Configuration Status
      description: 'The status of the NSX NDR deployment configuration.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/DeploymentConfigurationStatus'
      example:
