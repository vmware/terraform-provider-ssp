                  license_token: <JWT_TOKEN>
                  license_type: V2
                  product_display_name: VMware vDefend Firewall with Advanced Threat
                    Prevention
                  product_family: FIREWALL WITH ATP
                  quantity: 1880
                  sku_code: ANS-FW-ATP
                  source: LICENSE_HUB
                  source_id: ''
                  source_version: ''
                  unit_of_measure: Core
        '400':
