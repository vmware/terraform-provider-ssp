      description: 'Supported on SSP Installer, License Hub, and SSP instance types.

        Provide the username and password in the `Authorization` header using the
        **Basic** scheme (RFC 1945). The credentials must be a base64-encoded string
        of `username:password`.

        Sample curl commands:

        * `curl -H "Authorization: Basic <base64_auth_params>" https://api.example.com`

        * `curl -u "username:password" https://api.example.com`

        '
    auditor:
      type: apiKey
      in: header
      name: Authorization
      description: 'Supported on SSP Installer, License Hub, and SSP instance types.

        Provide the username and password in the `Authorization` header using the
