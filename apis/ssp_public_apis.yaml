      description: Supported on License Hub instance type only. Allowed for user with
        license auditor role
info:
  title: Security Services Platform API
  description: Security Services Platform API for monitoring, managing, and configuring
    the Security Services Platform.
  version: 5.2.0.0.0
  contact:
    name: Security Services Platform Team
openapi: 3.0.1
servers:
- url: https://{api_host}
  variables:
    api_host:
      default: ssp.broadcom.com
      description: this value is assigned by the user during install of ssp
tags:
- name: alarms
  description: APIs for SSP Alarms.
- name: backup-restore
  description: APIs for Security Service Platform Backup/Restore operations.
- name: cluster-monitor
  description: 'APIs for monitoring Security Services Platform cluster, features,
    and services.


    **Endpoint Guide:**

    - `/cluster/monitor/feature/health` - Hierarchical health: Features -> Services
    -> Components

    - `/cluster/monitor/platform/status` - Complete cluster state: health, config,
    form factor, versions

    - `/cluster/monitor/services/status` - Service metrics: health and resource utilization
    per category


    **Workflow:** Start with `/platform/status` for overall health, then drill into
    `/feature/health` for feature issues or `/services/status` for resource issues.


    **Common Concepts:**

    - Health: `UP`, `PARTIALLY_UP`, `DOWN`

    - Data refresh: Health cached (60s), metrics real-time

    '
- name: telemetry
  description: API for SSP Telemetry (Customer Experience Improvement Program).
- name: certificates
  description: "API for managing trust relationships and certificate rotations in\
    \ the Security Service Platform (SSP).\n\n**Workflow Overview:**\nCertificate\
    \ rotation is a multi-step workflow that safely distributes new certificates across\
    \ all\nactive verticals without disrupting communications. The workflow progresses\
    \ through\nstages: preparation, distribution, switching, and cleanup.\n\nThe set\
    \ of verticals involved in a rotation depends on the deployment configuration\
    \ (form\nfactor and which services are currently deployed and enabled). Verticals\
    \ fall into two\nbehaviorally distinct categories:\n* **With node-level detail**\
    \ - Trust manager tracks per-node rotation progress and reports\n  per-node success/failure\
    \ outcomes for these verticals.\n* **Start acknowledgment only** - Rotation is\
    \ initiated but actual progress is managed\n  externally; only whether the rotation\
    \ was successfully started is recorded. No per-node\n  detail is available through\
    \ this API for these verticals.\n\n**What Triggers a Rotation (background context):**\n\
    There is no public API endpoint to trigger rotation. Understanding the trigger\
    \ context\nhelps interpret the `rollout_type` field in status responses.\n* `PLATFORM_CA`\
    \ - Triggered automatically by the platform when the root CA certificate\n  is\
    \ near expiration, or initiated via the Trust Management UI. Renewing the root\
    \ CA\n  causes all CA-signed platform certificates to be re-issued and distributed\
    \ across all\n  verticals.\n* `INGRESS` - Initiated via the Trust Management UI\
    \ only, when a new CA-signed ingress\n  certificate is applied to replace the\
    \ external-facing TLS certificate.\n\n**Scope of this public API:**\nThis API\
    \ is read-only with respect to the rotation workflow. Use it to monitor rotation\n\
    progress and clear the status after completion. It does not expose endpoints to\
    \ start,\npause, or cancel a rotation.\n\n**Typical Usage Sequence:**\n1. Certificate\
    \ rotation is initiated internally by the platform.\n2. Poll `GET /trust/trust-rollout-status`\
    \ to monitor overall progress and per-vertical summaries.\n3. When the overall\
    \ status is `COMPLETED_WITH_FAILURES`, use `POST /trust/trust-rollout-status`\n\
    \   with filter criteria to drill into specific verticals and node-level failure\
    \ details.\n4. Once the overall status reaches a terminal state (`COMPLETED_SUCCESSFULLY`\
    \ or\n   `COMPLETED_WITH_FAILURES`), call `DELETE /trust/trust-rollout-status`\
    \ to reset and clear\n   the status, preparing the system for the next rotation.\n"
- name: cloud-connector-config
  description: 'Update Cloud Connector Configuration

    Update configuration for Cloud Connector deployment.


    The Cloud Connector configuration must be provided before deploying

    the Cloud Connector feature. Cloud Connector can be deployed directly

    via its deployment API, or it is deployed automatically when required

    as part of the deployment of dependent features (e.g., NDR or Malware

    Prevention) that are configured to require cloud connectivity.


    Once the Cloud Connector feature has been deployed, configuration

    changes require the feature to be removed and re-deployed with the new

    settings.

    '
