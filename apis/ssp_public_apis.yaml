        content_library:
          title: Content Library
          description: vCenter server content library name that contains the detonation
            VM images
          type: string
          example: MalwareAnalysisLibrary
        network:
          $ref: '#/components/schemas/MalwareAnalysisVcNetworkParameters'
    MalwareAnalysisVcNetworkParameters:
      title: Malware Analysis VC Network Parameters
      description: 'vCenter network parameters for Malware Prevention on-premise analysis
        mode.

        '
      type: object
      properties:
        gateway_vm_use_dhcp:
          title: Use DHCP for Gateway VM
          description: Controls whether to use DHCP to obtain Gateway VM IP address
          type: boolean
          default: true
        gateway_vm_mgmt_network_name:
          title: Gateway VM Management Network Name
          description: Name of the network to use for Gateway VM to connect to AnonVPN
            server pod running in SSP
          type: string
          example: VM Network
        gateway_vm_mgmt_network_mask:
          title: Gateway VM Management Network Mask
          description: Gateway VM Management Network Netmask if DHCP is not used
          type: string
          example: 255.255.255.0
        gateway_vm_ip_address:
          title: Gateway VM IP Address
          description: Gateway VM IP address if DHCP is not used
          type: string
          example: 192.168.1.100
        gateway_vm_ipv4_gateway:
          title: Gateway VM IPv4 Gateway
          description: Gateway VM IPv4 Gateway if DHCP is not used
          type: string
          example: 192.168.1.1
        gateway_vm_use_ssp_ntp_and_dns:
          title: Use SSP NTP and DNS
          description: Controls whether Gateway VM should use SSP NTP and DNS server
          type: boolean
          default: true
        ssp_ntp_server_ip_address:
          title: SSP NTP Server IP Address
          description: SSP NTP server IP address if SSP NTP and DNS server is not
            used
          type: string
          example: 10.0.0.1
        ssp_dns_server_ip_address:
          title: SSP DNS Server IP Address
          description: SSP DNS server IP address if SSP NTP and DNS server is not
            used
          type: string
          example: 10.0.0.2
        sandbox_vm_network_name:
          title: Sandbox VM Network Name
          description: Name of the network to use for sandbox VMs
          type: string
          example: Isolated-Sandbox-Network
    MalwareAnalysisVcConfigurationStatus:
      title: Malware Analysis VC Configuration Status
      description: 'The status of the Malware Analysis VC deployment configuration.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/DeploymentConfigurationStatus'
      example:
        status: DEPLOYMENT_REQUIRED
        message: Malware Analysis VC deployment configuration has been updated but
          has not been applied. Deploy the feature to apply the configuration.
    MalwarePreventionConfiguration:
      title: Malware Prevention Deployment Configuration
      description: 'The deployment configuration for Malware Prevention, including
        analysis mode

        and data sharing parameters.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - $ref: '#/components/schemas/MalwarePreventionParameters'
      example:
        _create_time: 1770239560456
        _create_user: admin
        _last_modified_time: 1770239560456
        _last_modified_user: admin
        _resource_type: MalwarePreventionConfiguration
        _revision: 1
        _system_owned: false
        display_name: Malware Prevention Configuration
        cloud_file_sharing_params:
          file_metadata_sharing_mode: true
          file_sharing_mode: true
          file_type_categories:
            archive: true
            document: true
            executable: true
            java: true
            media: true
            script: true
        data_retention_params:
          file_retention_duration: 7
          report_retention_duration: 7
        mps_features_supported:
        - FILE_SIZE_LIMIT
        - AMSI_BUFFER_SCAN
        - FILE_EXCLUSION
    MalwarePreventionParameters:
      title: Malware Prevention Parameters
      description: 'Parameters for Malware Prevention configuration.

        '
      type: object
      properties:
        cloud_file_sharing_params:
          $ref: '#/components/schemas/MalwarePreventionCloudFileSharingParameters'
        data_retention_params:
          $ref: '#/components/schemas/MalwarePreventionDataRetentionParameters'
        mps_features_supported:
          title: MPS Features Supported
          description: 'Array of MPS features that are supported/enabled for this
            deployment.

            This field is read-only and managed by the server. Any value provided

            in a PUT request will be ignored.

            '
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/MpsFeaturesSupported'
    MpsFeaturesSupported:
      title: MPS Features Supported
      description: 'Enum representing the features supported by Malware Prevention
        Service.

        FILE_SIZE_LIMIT: File size limit based detection/analysis feature.

        AMSI_BUFFER_SCAN: AMSI buffer scan for fileless malware detection feature.

        FILE_EXCLUSION: File exclusion rules feature.

        '
      type: string
      enum:
      - FILE_SIZE_LIMIT
      - AMSI_BUFFER_SCAN
      - FILE_EXCLUSION
    MalwarePreventionCloudFileSharingParameters:
      title: Malware Prevention Cloud File Sharing Parameters
      description: 'Cloud data sharing parameters for Malware Prevention.

        '
      type: object
      properties:
        file_metadata_sharing_mode:
          title: File Metadata Sharing Mode
          description: Controls whether file metadata is shared with the cloud for
            analysis
          type: boolean
          default: true
        file_sharing_mode:
          title: File Sharing Mode
          description: Controls whether files are shared with the cloud for analysis
          type: boolean
          default: true
        file_type_categories:
          $ref: '#/components/schemas/MalwarePreventionFileTypeCategories'
    MalwarePreventionFileTypeCategories:
      title: Malware Prevention File Type Categories
      description: 'File type categories for Malware Prevention analysis.

        These settings control which file types are analyzed.

        Used when analysis_mode is set to ON_PREM.

        '
      type: object
      properties:
        archive:
          title: Archive Files
          description: Enable analysis for archive files (zip, tar, etc.)
          type: boolean
          default: true
        document:
          title: Document Files
          description: Enable analysis for document files (pdf, doc, etc.)
          type: boolean
          default: true
        executable:
          title: Executable Files
          description: Enable analysis for executable files (exe, dll, etc.)
          type: boolean
          default: true
        java:
          title: Java Files
          description: Enable analysis for Java files (jar, class, etc.)
          type: boolean
          default: true
        media:
          title: Media Files
          description: Enable analysis for media files (jpg, mp4, etc.)
          type: boolean
          default: true
        script:
          title: Script Files
          description: Enable analysis for script files (js, ps1, etc.)
          type: boolean
          default: true
    MalwarePreventionDataRetentionParameters:
      title: Malware Prevention Data Retention Parameters
      description: 'Data retention parameters for Malware Prevention.

        These parameters control how long files and reports are retained.

        Used when analysis_mode is set to ON_PREM.

        '
      type: object
      properties:
        file_retention_duration:
          title: File Retention Duration
          description: Number of days to retain files for analysis (1-365 days)
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          default: 7
        report_retention_duration:
          title: Report Retention Duration
          description: Number of days to retain analysis reports (1-365 days)
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          default: 7
    MalwarePreventionConfigurationStatus:
      title: Malware Prevention Configuration Status
      description: 'The status of the Malware Prevention deployment configuration.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/DeploymentConfigurationStatus'
    NdrConfiguration:
      title: NDR Deployment Configuration
      description: 'The deployment configuration for NSX NDR (Network Detection and
        Response),

        including data sharing settings for cloud-based threat intelligence.

        '
