    put:
      summary: Update an existing site on the platform.
      description: "Update an existing site to support actions like reconnecting.\
        \ The platform will keep the site up to date as long as\nthe site remains\
        \ connected and healthy, thus, updating information on the site is not required.\
        \ However, in the case\nof a connection being lost, update allows the site\
        \ to be reconnected using provided credentials. \n\n**Notes:**\n- The credentials\
        \ provided are one-time use to re-establish the connection. They are never\
        \ stored or re-used.\n- **Connection Type Changes Not Allowed**: You cannot\
        \ change the connection type (DYNAMIC <-> STATIC) during a reconnect operation.\
        \ The connection type must remain the same as it was during initial onboarding.\n\
        - **To Change Connection Type**: You must first offboard the site, then onboard\
        \ it again with the new connection type.\n- **IP/Hostname Changes Allowed**:\n\
        \  - For DYNAMIC mode: You can change the hostname during reconnect.\n  -\
        \ For STATIC mode: You can change the host addresses (IPs/ports) during reconnect.\n"
      operationId: UpdateSite
      parameters:
      - in: path
        required: true
        name: site-id
        description: The site ID of the site being updated.
        schema:
          type: string
      requestBody:
        required: true
        description: All required details for taking action on a site.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Site'
            example:
              site_connection_info:
                connection_type: DYNAMIC
                hostname: 192.168.0.1
                username: admin
                password: password123
                certificate: '{nsx_cert}'
              site_type: NSX_MANAGER
              site_name: nsx-mgr-0
              desired_state: ONBOARD
      responses:
        '202':
          description: ACCEPTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_code: 200001
                error_message: An internal server error occurred.
                module_name: site
      tags:
      - site-service
      security:
      - enterprise_admin: []
    delete:
      summary: Offboard and delete a site from the platform.
      description: "Deleting a site will asynchronously perform actions to remove\
        \ references to this SSP instance on the site and, when\nfinished successfully,\
        \ delete the site from the platform. \n\nIf the connection between the site\
        \ and the platform is not healthy, then the force parameter can be used. When\
        \ force is\ntrue, the platform will attempt best-effort to remove references\
        \ to this SSP instance from the site, but will ignore \nerrors from the site.\
        \ The result will be the removal of the site from the platform, but possibly\
        \ references to the platform\nremaining on the site. This scenario can lead\
        \ to errors when attempting to onboard the site to a new SSP. In this scenario,\n\
        the force parameter will have to be used when onboarding the site.\n\nDuring\
        \ offboarding, the site enterprise admin username and password are required\
        \ to allow SSP to delete certain artifacts\nthat are specific to this platform.\n\
        \n**Notes:**\n* The credentials provided are one-time use and never stored\
        \ or re-used.\n* The status of offboarding can be checked by calling GET /sites/{site-id}.\
        \ Once offboarding is completed,\nthe site will automatically be deleted,\
        \ at which point calling GET /sites/{site-id} will return a 404. This\nsignifies\
        \ a successful offboard and deletion.\n"
      operationId: DeleteSiteById
      parameters:
      - in: path
        required: true
        name: site-id
        description: The site ID of the site being deleted.
        schema:
          type: string
      - in: query
        required: false
        name: force
        description: "Force can be used to offboard, ignoring any errors that may\
          \ occur in communication with the site. \nIf the site is to be onboarded\
          \ to a different SSP, the use of the force parameter may be required during\
          \ re-onboarding.\n"
        schema:
          type: boolean
      requestBody:
        required: false
        description: Credentials for the site to be able to connect to and cleanup
          the site. If the force parameter is false, credentials are required.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCredentials'
            example:
              username: admin
              password: password123
      responses:
        '202':
          description: ACCEPTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncApiResponse'
              example:
                id: 2dc09816-34c0-43fb-99a6-b19b249a43da
                status_url: https://vxlan-vm-111-131.nimbus-tb.nimbus.internal/ssp/sites/2dc09816-34c0-43fb-99a6-b19b249a43da
        '400':
