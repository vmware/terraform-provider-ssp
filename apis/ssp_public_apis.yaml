    UpgradeCoordinatorConfigurationStatus:
      title: Upgrade Coordinator Configuration Status.
      description: 'The status of the Upgrade Coordinator deployment configuration.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/DeploymentConfigurationStatus'
    SspFeature:
      type: string
      title: Feature
      description: 'vDefend feature name enum.

        Feature METRICS is pre-installed with Security Services Platform and cannot
        be installed or uninstalled separately.

        '
      enum:
      - MALWARE_PREVENTION
      - INTELLIGENCE
      - NDR
      - BAREMETAL_SECURITY
      - RULE_ANALYSIS
      - AI_ASSISTANT_PLATFORM
      - AI_ASSISTANT_THREAT_DEFENSE
      - MALWARE_ANALYSIS_VC
      - SPAC
      - NETWORK_TRAFFIC_ANALYSIS
      - UPGRADE_COORDINATOR
      - CLOUD_CONNECTOR
      - METRICS
    SspDeploymentProgress:
      type: object
      title: Deployment progress snapshot
      description: 'Provides the current deployment progress, including a completion
        percentage and accompanying descriptive status text.

        '
      properties:
        percentage:
          title: Completion percentage
          type: integer
          minimum: 0
          maximum: 100
          description: 'Deployment progress is shownas a percentage (0-100).

            '
        message:
          title: Current step description
          type: string
          description: 'Short status line describing the active step (for example
            chart apply or validation phase).

            '
        error_details:
          title: Resource-level errors
          type: array
          description: 'List of errors and details about resources in error.

            '
          items:
            $ref: '#/components/schemas/SspProgressErrorDetails'
    SspDeploymentActionStatus:
      type: object
      title: Record of a single deployment action and its outcome.
      description: 'Represents a single deployment action and its terminal result,
        such as deploy.

        '
      properties:
        action:
          title: Deployment action name
          type: string
          description: 'The specific deployment action executed (RUN_PRECHECK, DEPLOY,
            UNDEPLOY, or FORCE_UNDEPLOY).

            '
        status:
          title: Action outcome status
          $ref: '#/components/schemas/SspDeploymentStatus'
    SspProgressErrorDetails:
      type: object
      title: Progress error detail row
      description: 'Detailed error information for a single resource that failed during
        deployment

        '
      properties:
        resource_type:
          title: Resource Type
          type: string
          description: The type of resource showing an error
        resource_name:
          title: Resource name
          type: string
          description: The name of the resource showing an error
        message:
          title: Message
          type: string
          description: 'A concise description of the error encountered

            '
        events:
          title: Events
          type: array
          description: Events from the resource
          items:
            type: string
    SspFeatureDeployment:
      title: Staged platform feature deployment request
      description: A request to stage a deployment action for a platform feature
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - type: object
        required:
        - action
        - _revision
        properties:
          action:
            title: Action
            $ref: '#/components/schemas/SspDeploymentAction'
    SspDeploymentAction:
      title: Deployment action
      description: 'Chooses which lifecycle operation to queue for the feature.


        * `RUN_PRECHECK`: Run pre-flight validation checks against the feature configuration.

        * `DEPLOY`: Execute pre-flight validation checks and deploy the feature using
        the staged configuration.

        * `UNDEPLOY`: Remove the deployed feature (fails if dependencies exist).

        * `FORCE_UNDEPLOY`: Forcefully remove the deployed feature and cascade delete
        dependencies.

        '
      type: string
      enum:
      - RUN_PRECHECK
      - DEPLOY
      - UNDEPLOY
      - FORCE_UNDEPLOY
    SspDeploymentStatus:
      title: Deployment phase and outcome
      description: 'High-level lifecycle state for the feature.


        - `QUEUED`: Accepted but not yet executing.

        - `PRECHECKS_IN_PROGRESS`: Prechecks running.

        - `DEPLOYMENT_IN_PROGRESS`: Deployment or activation work running.

        - `DEPLOYMENT_SUCCESSFUL`: Feature active.

        - `PRECHECKS_FAILED`: Validation blocked deployment; fix findings before redeploying.

        - `PRECHECKS_SUCCESSFUL`: Checks passed but deployment not started or not
        yet requested.

        - `DEPLOYMENT_FAILED`: Deploy failed; inspect logs and `deployment_results`.

        - `UNDEPLOYMENT_IN_PROGRESS`: Removal running.

        - `UNDEPLOYMENT_FAILED`: Removal failed; may require force path or manual
        cleanup.

        - `NOT_DEPLOYED`: Feature not deployed.

        - `UNKNOWN`: Transitional or indeterminate. Retry status later.

        - `DEPLOYMENT_PARTIAL_SUCCESS`: Partial deploy; some subcomponents unhealthy.


        Terminal states differ by operation: a successful remove ends in `NOT_DEPLOYED`
        after undeployment completes.

        '
      type: string
      enum:
      - QUEUED
      - PRECHECKS_IN_PROGRESS
      - DEPLOYMENT_IN_PROGRESS
      - DEPLOYMENT_SUCCESSFUL
      - PRECHECKS_FAILED
      - PRECHECKS_SUCCESSFUL
      - DEPLOYMENT_FAILED
      - UNDEPLOYMENT_IN_PROGRESS
      - UNDEPLOYMENT_FAILED
      - NOT_DEPLOYED
      - UNKNOWN
      - DEPLOYMENT_PARTIAL_SUCCESS
    SspCheckStatus:
      title: Individual pre-check row status
      description: Status of an individual pre-check for the platform feature.
      type: string
      enum:
      - SUCCESS
      - FAILED
      - WARNING
      - SKIPPED
      - IN_PROGRESS
      - STOPPING
      - STOPPED
      - PENDING
      - NOT_STARTED
    SspCheckOverallStatus:
      title: Check Overall Status
      description: 'Roll-up across all pre-check rows (overall Prechecks banner: success,
        warnings, failure, or still running).

        '
      type: string
      enum:
      - NOT_STARTED
      - IN_PROGRESS
      - SUCCESS
      - SUCCESS_WITH_WARNINGS
      - FAILED
    SspPreCheckStatus:
      type: object
      title: Precheck status
      description: 'Status of an individual pre-check for the platform feature during
        validation.

        '
      required:
      - id
      - name
      - status
      - description
      - reason
      - feature
      properties:
        id:
          title: ID
          description: 'Unique identification for the pre-check.

            '
          type: string
        name:
          title: Name
          description: 'Display name of the pre-check.

            '
          type: string
        description:
          title: Description
          description: 'Description of the pre-check that specifies what is being
            checked.

            '
          type: string
        feature:
          title: Feature
          $ref: '#/components/schemas/SspFeature'
        status:
          title: Status
          $ref: '#/components/schemas/SspCheckStatus'
        reason:
          title: Reason
          description: 'Explanation or warning text for the pre-check result.

            '
          type: string
    SspPreCheckResults:
      title: Pre-check Results
      description: 'Summary of the overall status, per-check results, progress percentage,
        and initialization state for pre-checks.

        '
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - type: object
        required:
        - overall_status
        - prechecks
        - progress
        properties:
          system_status:
            title: Pre-check subsystem readiness
            type: string
            enum:
            - READY
            - INITIALIZING
            description: 'Indicates whether the system has completed loading precheck
              definitions.


              * `READY`: Rows may still be empty when no checks apply to the feature.

              * `INITIALIZING`: System is loading prechecks; retry after a short interval
              (about 10-30 seconds).

              '
          overall_status:
            title: Overall Status
            $ref: '#/components/schemas/SspCheckOverallStatus'
          prechecks:
            title: Prechecks
            type: array
            description: Individual pre-check results.
            items:
              $ref: '#/components/schemas/SspPreCheckStatus'
          progress:
            title: Progress
            type: integer
            minimum: 0
            maximum: 100
            description: Progress of the prechecks as a percentage (0-100)
          total_checks:
            title: Total Checks
            type: integer
            description: Total number of prechecks executed.
            readOnly: true
          passed_checks:
            title: Passed check count
            type: integer
            description: Number of prechecks that passed.
            readOnly: true
          failed_checks:
            title: Failed Checks
            type: integer
            description: Number of prechecks that failed.
            readOnly: true
    SspDeploymentResults:
      title: Deployment Results
      description: Results of the deployment action.
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - type: object
        properties:
          deployment_status:
            title: Deployment Status
            $ref: '#/components/schemas/SspDeploymentStatus'
          deployment_details:
            title: Deployment Details
            type: array
            description: Deployment action status details for each action executed
              on the feature.
            items:
              $ref: '#/components/schemas/SspDeploymentActionStatus'
          deployment_progress:
            title: Deployment Progress
            description: The progress object that provides further details on the
              progress of the deployment
            $ref: '#/components/schemas/SspDeploymentProgress'
          reason:
            title: Reason
            type: string
            description: Detailed reason for the status, if available.
    SspFeatureDeploymentStatus:
      type: object
      title: Feature Deployment Status
      description: Current status and progress of a feature deployment operation.
      required:
      - feature
      - precheck_results
      - deployment_results
      - action
      - overall_status
      properties:
        feature:
          title: Feature
          $ref: '#/components/schemas/SspFeature'
        precheck_results:
          title: Precheck Results
          $ref: '#/components/schemas/SspPreCheckResults'
          description: Summary of pre-check results (when RUN_PRECHECK action is executed
            or after prechecks)
        deployment_results:
          title: Deployment Results
          $ref: '#/components/schemas/SspDeploymentResults'
          description: Results of the deployment action.
        action:
          title: Action
          $ref: '#/components/schemas/SspDeploymentAction'
        overall_status:
          title: Overall Status of the feature deployment
          $ref: '#/components/schemas/SspDeploymentStatus'
        overall_progress:
          title: Overall Progress
          type: integer
          minimum: 0
          maximum: 100
          description: Progress of the feature deployment as a percentage (0-100)
    FeatureTypeEnum:
      title: Feature Type Enum
      description: Feature type enum
      type: string
      enum:
      - GEO_IP
      - IDPS_SIGNATURE
      - IP_REPUTATION
      - URL_DB
    MegaBundleSource:
      title: Mega Bundle Source
      description: 'Source type indicating how the mega bundle was created or obtained.

        - PACKAGED: Bundle was pre-packaged with the system or downloaded from official
        sources

        - MANUAL_UPLOAD: Bundle was manually uploaded by an administrator through
        the UI or API

        - CONTENT_PLUGIN: Bundle was automatically created or downloaded by a content
        plugin

        '
      type: string
      enum:
      - PACKAGED
      - MANUAL_UPLOAD
      - CONTENT_PLUGIN
    MegaBundleUploadStatus:
      title: Mega Bundle Upload Status
      description: 'Current upload status of the mega bundle processing lifecycle.

        - SUCCESS: Bundle has been successfully processed, validated, and deployed

        - FAILED: Bundle processing failed due to validation errors, corruption, or
        system issues

        - RUNNING: Bundle is currently being processed (validation, extraction, deployment)

        - ACCEPTED: Bundle upload has been accepted and queued for processing

        '
      type: string
      enum:
      - SUCCESS
      - FAILED
      - RUNNING
      - ACCEPTED
    MegaBundleType:
      title: Mega Bundle Type
      description: 'Type of mega bundle indicating the security content category.

        - FIREWALL_ATP: Advanced Threat Protection firewall bundle

        - AI_ASSISTANT_FIREWALL: AI Assistant Firewall bundle

        - AI_ASSISTANT_AVI: AI Assistant AVI bundle

        '
      type: string
      enum:
      - FIREWALL_ATP
      - AI_ASSISTANT_FIREWALL
      - AI_ASSISTANT_AVI
    ConnectivityMode:
      title: Connectivity Mode
      description: 'Connectivity mode of the security content service to cloud services.

        - DISCONNECTED: System operates in disconnected mode

        - CONNECTED: System operates in connected mode, can reach cloud services like
        vTIS and LastLine

        '
      type: string
      enum:
      - DISCONNECTED
      - CONNECTED
    ScsConfig:
      title: Security Content Service Configuration
      description: 'Global configuration for the security content service.

        Contains the connectivity mode setting which controls whether the system operates

        in air-gapped or connected mode.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - type: object
        required:
        - connectivity_mode
        properties:
          connectivity_mode:
            $ref: '#/components/schemas/ConnectivityMode'
          connectivity_mode_changeable:
            type: boolean
            readOnly: true
            description: 'Indicates whether the current connectivity_mode can be modified.

              When false, any attempt to change connectivity_mode will be rejected.

              Check mode_change_restrictions for the reasons.

              '
            example: true
          mode_change_restrictions:
            type: array
            readOnly: true
            description: 'List of reasons why connectivity_mode cannot be changed.

              Only populated when connectivity_mode_changeable is false.

              Each entry identifies the vertical/feature restricting the change and

              provides a human-readable reason with resolution guidance.

              '
            items:
              $ref: '#/components/schemas/ModeChangeRestriction'
      additionalProperties: false
    ModeChangeRestriction:
      title: Mode Change Restriction
      description: 'Represents a reason why connectivity mode cannot be changed.

        Each restriction identifies the vertical/feature that is restricting the change,

        provides a reason for the restriction, and suggests a resolution.

        '
      type: object
      properties:
        vertical:
          title: Vertical
          $ref: '#/components/schemas/Vertical'
        reason:
          title: Reason
          type: string
          description: 'Human-readable description of why this vertical is restricting
            the mode change.

            '
          example: IDPS site configuration exists
        resolution:
          title: Resolution
          type: string
          description: 'Suggested action to resolve the restriction and allow the
            mode change.

            '
          example: Remove all IDPS site configurations via DELETE /security-content/feature-config/idps/{site-id}
            API before switching mode
      additionalProperties: false
    Vertical:
      title: Vertical
      description: 'Vertical or feature that can restrict connectivity mode changes.

        - MPS: Malware Prevention Service

        - NDR: Network Detection and Response

        - CEIP: Customer Experience Improvement Program

        - IA: Intelligent Assist

        - IPF: In-product Feedback

        - CYPRESS: Intelligent Assist for Threat Defense

        - SENSOR: Sensor

        - IDPS: Intrusion Detection and Prevention System

        - URL_DB: URL Database

        '
      type: string
      enum:
      - MPS
      - NDR
      - CEIP
      - IA
      - IPF
      - CYPRESS
      - SENSOR
      - IDPS
      - URL_DB
    SiteIdpsConfig:
      title: Site IDPS Configuration
      description: 'Configuration for IDPS signature version assignment for a specific
        site.

        Controls which IDPS signature version is assigned to a site.

        - auto_update and assigned_version are mutually exclusive

        - When auto_update is true: assigned_version must be null. (site uses latest
        IDPS bundle version)

        - When auto_update is false: assigned_version must be provided (site uses
        specific IDPS bundle version)

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - type: object
        required:
        - site_id
        - auto_update
        properties:
          site_id:
            description: 'Unique identifier of the site this configuration applies
              to.

              This serves as the primary identifier for the configuration resource.

              '
            type: string
            example: 2dc4556b-3f18-481f-9826-61119ea9a7fc
          assigned_version:
            description: 'Specific IDPS signature version to assign to this site.

              This property is mutually exclusive with auto_update.

              - Required when auto_update is false

              - Must be null when auto_update is true.

              '
            type: string
            example: '1.0'
          auto_update:
            description: "Controls automatic updates for IDPS signatures.\nThis property\
              \ is mutually exclusive with assigned_version.\n- When true: Site automatically\
              \ uses the latest available version.\n- When false: Site uses the specific\
              \ version defined in assigned_version.\n  assigned_version is required.\n"
            type: boolean
            example: true
      additionalProperties: false
    FeatureVersion:
      title: Feature version
      description: Feature version
      properties:
        feature_type:
          title: Feature Type
          description: Feature type
          type: string
          example: GEO_IP
        versions:
          title: Versions
          description: List containing feature versions.
          type: array
          items:
            type: string
      additionalProperties: false
    MegaBundle:
      title: Mega Bundle
      description: 'A mega bundle is a comprehensive security content package that
        contains multiple security features

        and their associated data files. It represents a complete security content
        deployment unit that

        can include IDPS signatures, IP reputation data, URL databases, and GeoIP
        information.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - type: object
        properties:
          bundle_id:
            description: 'Unique identifier for the mega bundle. This ID is extracted
              from the bundle manifest

              and used to track the bundle throughout its lifecycle.

              '
            type: string
            example: nsx-security-content-v2.1.0
          bundle_type:
            description: 'Type or category of the mega bundle, indicating the kind
              of security content it contains.

              '
            $ref: '#/components/schemas/MegaBundleType'
          source:
            $ref: '#/components/schemas/MegaBundleSource'
          upload_status:
            $ref: '#/components/schemas/MegaBundleUploadStatus'
          status_message:
            description: 'Human-readable status message providing additional context
              about the current state

              of the bundle. Contains error details if deployment failed, or progress
              information

              during processing.

              '
            type: string
            example: Bundle successfully deployed with 3 features
          manifest_version:
            description: 'Version of the bundle manifest format used by this mega
              bundle. This helps ensure

              compatibility and proper parsing of the bundle contents.

              '
            type: string
            example: '1.0'
          ssp_version:
            description: 'SSP (Security Service Platform) version for which this mega
              bundle is intended.

              This indicates the target SSP version compatibility for the bundle contents.

              '
            type: string
            example: 4.1.0
          bundle_creation_time:
            description: 'Timestamp indicating when the mega bundle was originally
              created, as specified in the bundle manifest.

              This represents the bundle''s creation time, distinct from the system
              record creation time.

              '
            type: integer
            format: int64
            example: 1609459200
          features:
            description: 'List of security features contained within this mega bundle.
              Each feature represents

              a specific type of security content (e.g., IDPS signatures, IP reputation
              lists).

              '
            type: array
            items:
              $ref: '#/components/schemas/MegaBundleFeature'
      additionalProperties: false
    MegaBundleFeature:
      title: Mega Bundle Feature
      description: 'Represents a specific security feature contained within a mega
        bundle. Each feature

        corresponds to a particular type of security content with its own version
        and data files.

        '
      properties:
        feature_type:
          title: Feature Type
          description: 'Type of security feature. Defines the category of security
            content this feature provides.

            Common types include IDPS_SIGNATURE for intrusion detection signatures,
            IP_REPUTATION

            for IP reputation lists, URL_DB for URL categorization databases, and
            GEO_IP for

            geographical IP mapping data.

            '
          type: string
          example: IDPS_SIGNATURE
        feature_version:
          title: Feature Version
          description: 'Version identifier for this specific feature. Each feature
            type maintains its own

            versioning scheme, allowing independent updates of different security
            content types

            within the same mega bundle.

            '
          type: string
          example: 2.1.0
      additionalProperties: false
    MegaBundleListResult:
      title: List result of mega bundle
      description: List result for mega bundles.
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - title: Mega bundle list
        type: object
        description: Response of mega bundle listing.
        properties:
          results:
            description: List containing mega bundles.
            type: array
            items:
              $ref: '#/components/schemas/MegaBundle'
        additionalProperties: false
    FeatureVersionListResult:
      title: List result with versions of a feature
      description: List result with versions of a feature queried for.
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - title: Feature version list
        type: object
        description: Response of feature version listing.
        properties:
          results:
            title: Results
            description: List containing feature versions.
            type: array
            items:
              type: object
              properties:
                feature_type:
                  description: Feature type
                  type: string
                  example: IDPS_SIGNATURE
                versions:
                  description: List containing feature versions.
                  type: array
                  items:
                    type: string
        additionalProperties: false
    FeatureDownloadInfo:
      title: Feature Download Info
      description: Feature info with download URL
      properties:
        version:
          title: Version
          description: Feature version
          type: string
          example: '1.0'
        feature_updated_at:
          title: Feature Updated At
          description: 'Timestamp (epoch milliseconds) indicating when this feature
            version was last updated.

            Reflects the VTIS source update time when available; falls back to the
            SSP processing

            time (when the feature was ingested from the megabundle) when VTIS does
            not supply an

            update timestamp. This is the authoritative timestamp used to determine
            LATEST when

            feature_version=LATEST is requested.

            '
          type: integer
          format: int64
          example: 1775662785000
        contents:
          title: Contents
          description: Contents inside the feature
          type: array
          items:
            $ref: '#/components/schemas/Content'
    Content:
      title: Content
      description: 'Content info is  physical entity like file, folder and also has
        the

        downloadable link. The download links have default expiry of 7 days.

        One or more content makes the feature. One or more content are grouped

        into a feature.

        '
      properties:
        name:
          title: Name
          description: Name of the content.
          type: string
          example: IDSP_Signatures_1432.zip
        sha256_checksum:
          title: SHA256 Checksum
          description: Checksum of the file
          type: string
          example: 3a8456acb858eb7d883caa832a38316dc0f8230e2707ae283d5865e07b1b9277
        download_url:
          title: Download URL
          description: URL to download the content. The self signed URL  has expiry
            of 7 days.
          type: string
          example: https://cdn.example.com/bundle.zip?X-key=value
        _last_modified_time:
          title: Last Modified Time
          description: Timestamp of last modification
          readOnly: true
          $ref: '#/components/schemas/EpochMsTimestamp'
    ConfigurationStatus:
      title: Configuration Status
      description: The status of the last request configuration action.
      type: object
      required:
      - site_precheck_status
      - current_status
      properties:
        site_precheck_status:
          $ref: '#/components/schemas/SitePrecheckStatus'
        current_status:
          $ref: '#/components/schemas/SiteReadiness'
        configuration_message:
          title: Site Configuration message
          description: Messages regarding any configuration errors or successes.
          type: string
          readOnly: true
      additionalProperties: false
    UserCredentials:
      type: object
      title: User Credentials
      description: User Credentials for the Site.
      required:
      - username
      - password
      properties:
        username:
          title: Username
          type: string
          description: Username for Site.
          writeOnly: true
        password:
          title: Password
          type: string
          description: Password for Site.
          writeOnly: true
    SitePrecheckStatus:
      title: Site Precheck Status
      description: The status of prechecks run for the site.
      type: object
      properties:
        site_precheck_phase:
          $ref: '#/components/schemas/SiteStates'
        site_precheck_state:
          $ref: '#/components/schemas/SitePrecheckState'
        site_precheck_results:
          title: Site Precheck Results
          description: A result of all prechecks run for a site.
          type: array
          items:
            $ref: '#/components/schemas/SitePrecheckResult'
    SitePrecheckResult:
      title: Site Precheck Result
      description: Result for an individual site precheck
      type: object
      properties:
        precheck_name:
          title: Precheck Name
          description: The name of the site precheck that was run.
          type: string
        precheck_last_run_time:
          $ref: '#/components/schemas/EpochMsTimestamp'
        precheck_result_status:
          $ref: '#/components/schemas/PrecheckResultStatus'
        precheck_message:
          title: Precheck Message
          description: The message for the precheck result.
          type: string
    PrecheckResultStatus:
      title: Site Precheck Result Status
      description: An array of results a precheck can end with.
      type: string
      enum:
      - PASSED
      - FAILED
      - UNKNOWN
    SitePrecheckState:
      title: Site Precheck State
      description: States site prechecks can be in.
      type: string
      enum:
      - PASSED
      - FAILED
      - IN_PROGRESS
      - PASSED_WITH_WARNINGS
      - MIGRATION_REQUIRED
      - NOT_RUN
    SiteConnectionType:
      title: Site Connection Type
      description: The method used to connect to the site.
      type: string
      enum:
      - DYNAMIC
      - STATIC
    BaseSiteConnectionInfo:
      title: Base Site Connection Info
      description: Base connection information containing common fields for all connection
        types.
      type: object
      required:
      - username
      - password
      properties:
        connection_type:
          title: Connection Type
          type: string
          description: The connection method to use. Must be DYNAMIC for this type.
        username:
          title: Username
          description: Username to access the NSX site SSP will be communicating with.
            Required for all operations.
          type: string
          writeOnly: true
        password:
          title: Password
          description: Password to access the NSX site SSP will be communicating with.
            Required for all operations.
          type: string
          writeOnly: true
        certificate:
          title: Certificate
          description: The pem encoded certificate to be used to authenticate with
            the specified host. Required for all operations.
          type: string
          writeOnly: true
    DynamicSiteConnection:
      title: Dynamic Site Connection
      description: Connect to the site via a hostname which will be used to dynamically
        set the hostname SSP will use to communicate with the site.
      allOf:
      - $ref: '#/components/schemas/BaseSiteConnectionInfo'
      - type: object
        required:
        - connection_type
        properties:
          connection_type:
            type: string
            pattern: ^DYNAMIC$
            default: DYNAMIC
            description: The connection method to use. Must be DYNAMIC for this type.
          hostname:
            title: Site Hostname
            type: string
            description: The hostname of the site to connect to. This can be the IP
              of a manager, the virtual IP for the site, or the site's FQDN. SSP will
              discover all manager IPs from this endpoint, if applicable. Required
              for onboard and reconnect operations.
    StaticSiteConnection:
      title: Static Site Connection
      description: "Connect to the site via static addresses - either an FQDN or a\
        \ list of IPv4 addresses. Static connections to sites are only supported for\
        \ License Hub deployments. \n\n**Supported Formats:**\n- FQDN: `avi-lb.example.com`\
        \ (defaults to port 443)\n- FQDN with port: `avi-lb.example.com:8443`\n- IPv4\
        \ address: `192.168.1.10` (defaults to port 443)\n- IPv4 with port: `192.168.1.10:8443`\n\
        \n**Important Port Requirements:**\n- All addresses must use the **same port\
        \ number** (or all default to port 443 if not specified)\n- Mixed ports are\
        \ **not allowed**\n- In-cluster REST clients connect via Kubernetes Service\
        \ on port 443, which forwards to the backend port\n\n**Valid Examples:**\n\
        - Single FQDN (load balancer): `[\"avi-lb.example.com\"]`\n- FQDN with custom\
        \ port: `[\"avi-lb.example.com:8443\"]`\n- Multiple IPs: `[\"192.168.1.10:443\"\
        , \"192.168.1.11:443\", \"192.168.1.12:443\"]`\n- IPs defaulting to 443: `[\"\
        192.168.1.10\", \"192.168.1.11\", \"192.168.1.12\"]`\n\n**Invalid Examples:**\n\
        - Mixed ports: `[\"10.0.0.1:9443\", \"10.0.0.2:9444\"]`\n- Mixed explicit/implicit:\
        \ `[\"10.0.0.1:9443\", \"10.0.0.2\"]`\n"
      allOf:
      - $ref: '#/components/schemas/BaseSiteConnectionInfo'
      - type: object
        required:
        - connection_type
        properties:
          connection_type:
            type: string
            pattern: ^STATIC$
            default: STATIC
            description: The connection method to use. Must be STATIC for this type.
          host_addresses:
            title: Host Addresses
            type: array
            description: 'List of addresses for connecting to the site. Accepts FQDNs
              or IPv4 addresses,

              optionally with port. All addresses must use the same port.

              Required for onboard and reconnect operations.

              '
            minItems: 1
            items:
              type: string
            example:
            - 192.168.1.10:443
            - 192.168.1.11:443
            - 192.168.1.12:443
    SiteConnectionInfo:
      title: Site Connection Info
      description: Details about how to connect to the site to be configured. Supports
        dynamic and static endpoint connection methods for License Hub deployments,
        but only dynamic connections for ATP deployments.
      discriminator:
        propertyName: connection_type
        mapping:
          DYNAMIC: '#/components/schemas/DynamicSiteConnection'
          STATIC: '#/components/schemas/StaticSiteConnection'
      oneOf:
      - $ref: '#/components/schemas/DynamicSiteConnection'
      - $ref: '#/components/schemas/StaticSiteConnection'
    BaseSite:
      title: Base Site Object
      description: The base site object contains all properties that are common across
        all site types.
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - type: object
        required:
        - desired_state
        properties:
          desired_state:
            $ref: '#/components/schemas/SiteStates'
    Site:
      type: object
      title: The site object
      description: The full site object providing all details about the site. Required
        fields vary based on the desired state of the site. For onboarding, hostname,
        username, password, certificate and site_name are required. To reconnect a
        site, hostname, username, password and certificate are required.
      discriminator:
        propertyName: site_type
        mapping:
          NSX_MANAGER: '#/components/schemas/NsxManagerSite'
          SSP: '#/components/schemas/SspSite'
          AVI: '#/components/schemas/AviSite'
      oneOf:
      - $ref: '#/components/schemas/NsxManagerSite'
      - $ref: '#/components/schemas/AviSite'
      - $ref: '#/components/schemas/SspSite'
    NsxManagerSite:
      title: NSX Manager Site
      description: The NSX Manager Site object contains all data and state regarding
        a NSX Manager Site.
      allOf:
      - $ref: '#/components/schemas/BaseSite'
      - type: object
        required:
        - site_type
        - site_connection_info
        - site_name
        properties:
          site_type:
            title: Site Type
            description: Site type specifies what type of site the site is - NSX,
              SSP or AVI. For an NSX site, the value will always be NSX_MANAGER.
            type: string
            pattern: ^NSX_MANAGER$
            default: NSX_MANAGER
          site_connection_info:
            $ref: '#/components/schemas/SiteConnectionInfo'
          site_name:
            title: Site Name
            description: The name of the site. In the case of a NSX_MANAGER site,
              the name must match the name on NSX, if already configured. This site
              name is not editable after onboarding.
            type: string
          virtual_ip:
            title: Virtual IP
            description: If virtual IP is configured on the NSX site, this is the
              virtual IP.
            type: string
            readOnly: true
          manager_hostname:
            title: Manager Hostname
            description: The FQDN of the NSX site, if FQDN is configured.
            type: string
            readOnly: true
          cluster_manager_ips:
            title: Cluster Manager IPs
            description: The list of all NSX manager ips in the cluster of the site
              that SSP will be communicating with.
            type: array
            readOnly: true
            items:
              type: string
          status:
            $ref: '#/components/schemas/NsxSiteStatus'
    AviSite:
      title: AVI Site
      description: The Avi Site object contains all data and state regarding a Avi
        Site. Avi Sites are only supported when onboarding endpoints to License Hub.
      allOf:
      - $ref: '#/components/schemas/BaseSite'
      - type: object
        required:
        - site_type
        - site_connection_info
        properties:
          site_type:
            title: Site Type
            type: string
            description: Site type specifies what type of site the site is - NSX,
              SSP or AVI. For an Avi site, the value will always be AVI.
            pattern: ^AVI$
            default: AVI
          site_connection_info:
            $ref: '#/components/schemas/SiteConnectionInfo'
          virtual_ip:
            title: Virtual IP
            description: If virtual IP is configured for AVI, this is the virtual
              IP.
            type: string
            readOnly: true
          status:
            $ref: '#/components/schemas/AviSiteStatus'
    SspSite:
      title: SSP Site
      description: The SSP Site object contains all data and state regarding a SSP
        Site. SSP Sites are only supported when onboarding endpoints to License Hub.
      allOf:
      - $ref: '#/components/schemas/BaseSite'
      - type: object
        required:
        - site_type
        - site_connection_info
        properties:
          site_type:
            title: Site Type
            type: string
            description: Site type specifies what type of site the site is - NSX,
              SSP or AVI. For an SSP site, the value will always be SSP.
            pattern: ^SSP$
            default: SSP
          site_connection_info:
            $ref: '#/components/schemas/SiteConnectionInfo'
          status:
            $ref: '#/components/schemas/SspSiteStatus'
    SiteStates:
      title: Site State Enum
      description: The desired state of the site.
      type: string
      writeOnly: true
      enum:
      - ONBOARD
      - OFFBOARD
      - PREPARE
    SiteReadiness:
      title: Site Readiness
      description: Current health of the site. READY indicates the site is properly
        onboarded and ready for use.
      type: string
      readOnly: true
      enum:
      - READY
      - NOT_READY
      - INACTIVE
      - UNKNOWN
      - ONBOARD_IN_PROGRESS
      - OFFBOARD_IN_PROGRESS
    SiteClusterStatus:
      title: Site Cluster Status
      description: The status of the Site cluster.
      type: string
      readOnly: true
      enum:
      - STABLE
      - DEGRADED
      - UNAVAILABLE
    AgentState:
      title: Agent State
      description: The current state of an agent (pace-agent, common-agent, metrics-agent)
        running on the NSX Manager.
      type: string
      readOnly: true
      enum:
      - UP
      - DOWN
      - IN_PROGRESS
      - UNKNOWN
      - NOT_ENABLED
    AgentStatus:
      title: Agent Status
      description: The status object for an agent running on the NSX Manager.
      properties:
        status:
          $ref: '#/components/schemas/AgentState'
        last_transition_time:
          $ref: '#/components/schemas/EpochMsTimestamp'
      additionalProperties: false
    ConnectionStatus:
      title: Connection Status
      description: The current status of the connection between SSP and the NSX site.
      type: string
      readOnly: true
      enum:
      - HEALTHY
      - UNHEALTHY
      - UNKNOWN
    NsxSiteStatus:
      title: Site Status
      description: Status object for the NSX site that provides details on the status
        of components and actions.
      type: object
      readOnly: true
      properties:
        connection_status:
          $ref: '#/components/schemas/ConnectionStatus'
        infrastructure_sync_agent_status:
          $ref: '#/components/schemas/AgentStatus'
        inventory_sync_agent_status:
          $ref: '#/components/schemas/AgentStatus'
        cluster_status:
          $ref: '#/components/schemas/SiteClusterStatus'
        nsx_cluster_id:
          title: NSX Cluster ID
          description: The cluster id of the NSX site.
          type: string
          readOnly: true
        nsx_version:
          title: NSX Version
          description: The current version of the NSX site.
          type: string
          readOnly: true
        configuration_status:
          $ref: '#/components/schemas/ConfigurationStatus'
        conditions:
          title: Conditions
          type: array
          readOnly: true
          description: These conditions contribute to the overall readiness of the
            site.
          items:
            $ref: '#/components/schemas/SiteCondition'
      additionalProperties: false
    AviSiteStatus:
      title: AVI Site Status
      description: Status object for the Avi site that provides details on the status
        of components and actions.
      type: object
      readOnly: true
      properties:
        connection_status:
          $ref: '#/components/schemas/ConnectionStatus'
        cluster_status:
          $ref: '#/components/schemas/SiteClusterStatus'
        avi_id:
          title: AVI ID
          description: The id of the Avi VM.
          type: string
          readOnly: true
        avi_version:
          title: AVI Version
          description: The current version of the Avi site.
          type: string
          readOnly: true
        configuration_status:
          $ref: '#/components/schemas/ConfigurationStatus'
        conditions:
          title: Conditions
          type: array
          readOnly: true
          description: These conditions contribute to the overall readiness of the
            site.
          items:
            $ref: '#/components/schemas/SiteCondition'
      additionalProperties: false
    SspSiteStatus:
      title: SSP Site Status
      description: Status object for the SSP site that provides details on the status
        of components and actions.
      type: object
      readOnly: true
      properties:
        connection_status:
          $ref: '#/components/schemas/ConnectionStatus'
        ssp_cluster_status:
          $ref: '#/components/schemas/SiteClusterStatus'
        ssp_cluster_id:
          title: SSP Cluster ID
          description: The cluster id of the SSP site.
          type: string
          readOnly: true
        ssp_version:
          title: SSP Version
          description: The current version of the SSP site.
          type: string
          readOnly: true
        configuration_status:
          $ref: '#/components/schemas/ConfigurationStatus'
        conditions:
          title: Conditions
          type: array
          readOnly: true
          description: These conditions contribute to the overall readiness of the
            site.
          items:
            $ref: '#/components/schemas/SiteCondition'
      additionalProperties: false
    SiteCondition:
      title: Site Condition
      description: An individual condition on the site. Conditions determine the readiness
        of the site.
      properties:
        name:
          title: Name
          type: string
          readOnly: true
          description: Name of the condition.
        message:
          title: Message
          type: string
          readOnly: true
          description: Message providing further detail about the current state of
            the condition.
        last_transition_time:
          $ref: '#/components/schemas/EpochMsTimestamp'
        state:
          $ref: '#/components/schemas/ConditionState'
      additionalProperties: false
    ConditionState:
      title: Condition State
      description: The current state of a site condition.
      readOnly: true
      type: string
      enum:
      - PASS
      - FAIL
      - NOT_APPLICABLE
      - UNKNOWN
    SiteList:
      title: Site List
      description: List of NSX sites.
      type: object
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        required:
        - sites
        properties:
          sites:
            title: Sites
            description: List of site objects.
            readOnly: true
            type: array
            items:
              $ref: '#/components/schemas/Site'
    SiteType:
      title: Supported types of sites that can be onboarded to the platform. For ATP
        only NSX_MANAGER is supported today. If using License Hub, all three types
        are supported.
      description: The options for the supported types of sites.
      type: string
      enum:
      - NSX_MANAGER
      - SSP
      - AVI
    SiteFeatureSettings:
      title: Site Feature Settings object
      description: The object for SSP features that initiates necessary feature enablement
        workflows on the site. This does not activate or deploy the feature on SSP.
      type: object
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - type: object
        required:
        - is_intelligence_enabled
        - is_metrics_enabled
        - is_mps_enabled
        - is_ndr_enabled
        - is_rule_analysis_enabled
        - is_ndr_data_sharing_enabled
        properties:
          is_metrics_enabled:
            title: Metrics Enabled
            description: The state of the metrics feature for a site, which controls
              all metric data ingestion.
            type: boolean
          is_intelligence_enabled:
            title: Intelligence Enabled
            description: The state of the Intelligence feature for a site.
            type: boolean
            readOnly: true
          is_rule_analysis_enabled:
            title: Rule Analysis Enabled
            description: The state of the Rule Analysis feature for a site.
            type: boolean
            readOnly: true
          is_ndr_enabled:
            title: NDR Enabled
            description: The state of the NDR feature for a site.
            type: boolean
            readOnly: true
          is_mps_enabled:
            title: Malware Prevention Enabled
            description: The state of the Malware Prevention feature for a site.
            type: boolean
            readOnly: true
          is_ndr_data_sharing_enabled:
            title: NDR Data Sharing Enabled
            description: The state of NDR Data Sharing for a site.
            type: boolean
            readOnly: true
    LicenseList:
      title: License List
      description: List of all licenses
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        properties:
          results:
            type: array
            description: List of all licenses on SSP.
            items:
              $ref: '#/components/schemas/SspLicense'
        required:
        - results
    SspLicense:
      type: object
      title: SSP License
      description: License details
      properties:
        license_id:
          type: string
          title: License ID
          description: ID of the license.
        license_type:
          $ref: '#/components/schemas/LicenseType'
        source:
          title: Source
          $ref: '#/components/schemas/Source'
        source_id:
          type: string
          title: Source ID
          description: 'This refers to the id of the onboarded NSX manager, AVI controller
            or Licensing Service.

            '
        sku_code:
          type: string
          title: SKU Code
          description: Security SKU code of the license.
          example: ANS-FW-ATP
        product_display_name:
          type: string
          title: Product Display Name
          description: Display name of the product.
          example: VMware vDefend Firewall with Advanced Threat Prevention
        product_family:
          type: string
          title: Product Family
          description: 'This refers to the family of the product.

            (e.g., ''AVI LOAD BALANCER'' or ''ADVANCED THREAT PROTECTION'', ...).

            '
          example: FIREWALL WITH ATP
        quantity:
          type: integer
          format: int32
          title: Quantity
          description: Total assigned quantity for the license.
        unit_of_measure:
          type: string
          title: Unit of Measure
          description: 'Unit of measure.

            Examples include Core for Firewall and ATP SKUs,

            and Service Units (SU) for AVI Load Balancer SKUs.

            '
        expiration_date:
          $ref: '#/components/schemas/EpochMsTimestamp'
        expiry_date_with_grace_period:
          $ref: '#/components/schemas/EpochMsTimestamp'
        license_token:
          type: string
          title: License Token
          description: 'This is a license jwt token. This represents license entitlement
            spec

            in a jwt format.

            '
    Source:
      type: string
      title: Source
      description: This refers to source of the license.
      enum:
      - NSX_MANAGER
      - LICENSE_HUB
      - AVI_CONTROLLER
    LicenseType:
      type: string
      title: License Type
      description: Type of License.
      enum:
      - DLF
      - V2
      - KEYLESS
      - SUBSCRIPTION
      - EVAL
    License:
      type: object
      title: License
      description: License details
      properties:
        license_id:
          type: string
          title: License ID
          description: ID of the license.
        license_type:
          title: License Type
          $ref: '#/components/schemas/LicenseType'
        sku_code:
          type: string
          title: SKU Code
          description: Security SKU code of the license.
        support_product_id:
          type: string
          title: Support Product ID
          description: Product Id for support.
        product_display_name:
          type: string
          title: Product Display Name
          description: Display name of the product.
        product_family:
          type: string
          title: Product Family
          description: 'This refers to the family of the product.

            (e.g., ''AVI LOAD BALANCER'' or ''ADVANCED THREAT PREVENTION'', ...).

            '
        product_type:
          title: Product Type
          $ref: '#/components/schemas/ProductType'
        quantity:
          type: integer
          format: int32
          title: Quantity
          description: Total assigned quantity for the license.
        unit_of_measure:
          type: string
          title: Unit of Measure
          description: 'Unit of measure.

            Examples include Core for Firewall and ATP SKUs,

            and Service Units (SU) for AVI Load Balancer SKUs.

            '
        status:
          title: Status
          $ref: '#/components/schemas/Status'
        expiration_date:
          title: Expiration Date
          $ref: '#/components/schemas/EpochMsTimestamp'
        grace_period:
          type: string
          title: Grace Period
          description: 'This refers to the additional time after a license expires
            during

            which the software continues to function normally in ISO 8601 duration
            format.

            Some examples using the ISO 8601 duration format:

            P90D means a grace period of 90 days.

            P1M represents a grace period of 1 month.

            '
        inactive_grace_period:
          type: string
          title: Inactive Grace Period
          description: 'Inactive grace period in ISO 8601 duration format (e.g. P90D).

            '
        inactive_grace_period_enabled:
          type: boolean
          title: Inactive Grace Period Enabled
          description: 'Indicates whether the license is in inactive grace period.

            '
        inactive_grace_period_expiration_date:
          title: Inactive Grace Period Expiration Date
          $ref: '#/components/schemas/EpochMsTimestamp'
          description: 'Indicates when the inactive grace period will be expired.
            Post this date

            the license becomes eligible for deletion.

            '
        expiration_pre_warning:
          type: string
          title: Expiration Pre-Warning
          description: Pre-warning period for expiration in ISO 8601 duration format
            (e.g. P60D).
        license_warnings:
          title: License Warnings
          $ref: '#/components/schemas/LicenseWarningArray'
        subscriptions:
          title: Subscriptions
          $ref: '#/components/schemas/SubscriptionArray'
        license_token:
          type: string
          title: License Token
          readOnly: true
          description: 'This is a license jwt token. This represents license entitlement
            spec

            in a jwt format.

            '
    ProductType:
      type: string
      title: Product Type
      description: Type of product.
      enum:
      - BASE
      - ADDON
    UnitOfMeasure:
      type: string
      title: Unit of Measure
      description: 'Unit of measure.

        Examples include Cores for Firewall and ATP SKUs,

        and Service Units (SU) for AVI Load Balancer SKUs.

        '
      enum:
      - CORES
      - SU
    Subscription:
      type: object
      title: Subscription
      description: Subscription details
      properties:
        serial_number:
          type: string
          title: Serial Number
          description: Serial number of the subscription.
        allocation_quantity:
          type: integer
          format: int32
          title: Allocation Quantity
          description: Total allocated quantity for the subscription.
        start_date:
          title: Start Date
          $ref: '#/components/schemas/EpochMsTimestamp'
          description: Start date of the subscription.
        end_date:
          title: End Date
          $ref: '#/components/schemas/EpochMsTimestamp'
          description: End date of the subscription.
    SubscriptionArray:
      type: array
      title: Subscription Array
      description: Array of subscription details
      items:
        $ref: '#/components/schemas/Subscription'
    LicenseWarningArray:
      type: array
      title: License Warning Array
      description: Array of license warning details
      items:
        $ref: '#/components/schemas/LicenseWarning'
    LicenseWarning:
      type: object
      title: License Warning
      description: License warning details
      properties:
        warning_date:
          title: Warning Date
          $ref: '#/components/schemas/EpochMsTimestamp'
          description: Date of warning.
        warning_reason:
          type: string
          title: Warning Reason
          description: Reason for warning.
          enum:
          - USAGE_DUE
          - SUBSCRIPTION_EXPIRATION
        pre_warning_period:
          type: string
          title: Pre-Warning Period
          description: Pre-warning period in ISO 8601 duration format (e.g., P60D).
    SspUpgradePrecheck:
      title: Pre-Check
      description: 'Pre-check validation definition that describes a specific system
        readiness

        assessment for SSP upgrade.

        Pre-checks are designed to identify potential issues before beginning the

        upgrade process, enabling early problem detection and resolution.

        '
      allOf:
      - $ref: '#/components/schemas/AsyncActivity'
      - type: object
        required:
        - id
        - display_name
        - description
      additionalProperties: false
    SspUpgradePrecheckList:
      title: Pre-Checks List
      description: 'List of available pre-checks validation definitions. This response
        provides

        metadata about all pre-checks that will be executed during pre-upgrade

        validation.

        '
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        required:
        - results
        properties:
          results:
            type: array
            title: Pre-Checks Definitions
            description: Array of pre-checks validation definitions.
            items:
              $ref: '#/components/schemas/SspUpgradePrecheck'
      additionalProperties: false
    SspUpgradeStep:
      title: Upgrade Step
      description: 'Upgrade step definition that describes a major phase in the SSP
        upgrade

        workflow. Each step represents a discrete upgrade operation that transforms

        the system from the current version to the target version. Steps execute

        according to internal dependencies and orchestration logic.

        '
      allOf:
      - $ref: '#/components/schemas/AsyncActivity'
      - type: object
        required:
        - id
        - display_name
        - description
      additionalProperties: false
    SspUpgradeStepList:
      title: Upgrade Step List
      description: 'List of available upgrade step definitions and pre-checks definitions.

        This response provides metadata about all pre-checks and upgrade steps

        that will be executed during the upgrade operation, in the order they

        will execute.

        '
      allOf:
      - $ref: '#/components/schemas/ListResult'
      - type: object
        required:
        - results
        properties:
          results:
            type: array
            title: Upgrade Step Definitions
            description: Ordered array of upgrade step definitions.
            items:
              $ref: '#/components/schemas/SspUpgradeStep'
          pre_checks:
            type: array
            title: Pre-Checks Definitions
            description: 'Array of pre-checks validation definitions that will be
              executed

              before the upgrade. Pre-checks assess system readiness and

              identify potential issues.

              '
            items:
              $ref: '#/components/schemas/SspUpgradePrecheck'
      additionalProperties: false
    SspUpgradePrecheckStepStatus:
      title: Pre-Check Step Status
      description: 'Execution status of a pre-check validation step, combining the
        pre-check

        definition with real-time execution state and detailed status messages. This

        schema provides complete visibility into individual pre-check execution.


        Pre-checks are designed to fail fast, identifying problems early before any

        system modifications occur. This prevents partial upgrades and reduces the
        risk

        of system downtime. Pre-checks can be executed multiple times (idempotent)
        and

        can be re-run after addressing issues. The last_run_time field tracks the
        most

        recent execution.


        Running pre-checks before upgrade maintenance window is recommended.

        All FAILED pre-checks should be addressed and WARNING messages reviewed before

        proceeding with upgrade.

        '
      allOf:
      - $ref: '#/components/schemas/SspUpgradePrecheck'
      - $ref: '#/components/schemas/BaseUpgradeStepStatus'
      additionalProperties: false
    SspUpgradePreChecksStatus:
      title: Pre-Checks Status
      description: 'Aggregated status of all pre-checks validations, providing a complete
        view

        of system readiness for SSP upgrade along with detailed execution status for
        each

        individual pre-check. The overall_status provides a quick go or

        no-go decision, while individual pre_checks provide detailed execution results.

        '
      type: object
      required:
      - overall_status
      - pre_checks
      properties:
        overall_status:
          $ref: '#/components/schemas/BaseUpgradeStatus'
          title: Overall Pre-Checks Status
          description: 'Aggregated status across all pre-checks, representing the
            overall readiness

            of the system for upgrade.


            NOT_STARTED indicates pre-checks have not been initiated.


            IN_PROGRESS indicates one or more pre-checks are currently executing.


            SUCCESS indicates all pre-checks passed with no issues detected.


            SUCCESS_WITH_WARNINGS indicates all pre-checks completed successfully
            but

            some identified non-critical concerns. Review WARNING messages in individual

            pre-checks before deciding to proceed.


            FAILED indicates one or more pre-checks failed due to critical issues.
            The

            system is not ready for upgrade. Review ERROR messages in failed pre-checks,

            address the underlying issues, and re-run pre-checks before attempting
            upgrade.


            Note: SKIPPED is not applicable at the overall status level.

            '
        pre_checks:
          type: array
          title: Pre-Checks Execution Status
          description: 'Detailed execution status for each individual pre-checks validation.
            Each entry

            combines the pre-checks definition with real-time execution state.

            Pre-checks are returned in a consistent order but may execute in parallel.

            '
          items:
            $ref: '#/components/schemas/SspUpgradePrecheckStepStatus'
      additionalProperties: false
    SspUpgradeStepStatus:
      title: Upgrade Step Status
      description: 'Execution status of an upgrade step, combining the step definition
        with real-time

        execution state and detailed status messages.


        Upgrade steps transform the system from the current version to the target
        version

        through a series of coordinated operations. Steps may execute sequentially
        or in

        parallel based on internal dependencies. The last_run_time field tracks when
        each

        step executed.


        Unlike pre-checks, upgrade steps modify the system. Monitor progress carefully

        and do not interrupt the upgrade process unless absolutely necessary.

        '
      allOf:
      - $ref: '#/components/schemas/SspUpgradeStep'
      - $ref: '#/components/schemas/BaseUpgradeStepStatus'
      additionalProperties: false
    SspUpgradeStatus:
      title: Upgrade Status
      description: 'Aggregated status of the SSP upgrade operation, providing real-time
        visibility

        into upgrade progress and detailed execution status for each upgrade step.

        The upgrade process is asynchronous and may take significant time depending
        on

        system size and configuration.

        '
      type: object
      required:
      - current_version
      - target_version
      - overall_status
      - upgrade_steps
      properties:
        current_version:
          type: string
          title: Current Version
          description: 'Current version of the SSP system before upgrade. This field
            indicates the

            version from which the system is being upgraded.


            This field is always present and populated, even when upgrade status is

            NOT_STARTED, indicating the currently running system version.

            '
          readOnly: true
        target_version:
          type: string
          title: Target Version
          description: 'Target version of the SSP system after upgrade completion.
            This field indicates

            the version to which the system will be upgraded.


            This field is always present and populated, indicating the version that
            will

            be installed when the upgrade completes successfully.

            '
          readOnly: true
        overall_status:
          $ref: '#/components/schemas/BaseUpgradeStatus'
          title: Overall Upgrade Status
          description: 'Aggregated status of the entire upgrade operation, computed
            from individual

            step results. This provides a high-level view of upgrade progress and
            outcome.


            NOT_STARTED indicates upgrade has not been initiated.


            IN_PROGRESS indicates upgrade is actively executing. One or more steps
            are

            currently running.


            SUCCESS indicates all upgrade steps completed successfully.


            FAILED indicates one or more upgrade steps failed. The upgrade process
            has

            stopped. Review ERROR messages in the failed steps to understand what
            went

            wrong or connect with VMware Support for assistance.


            Note: SKIPPED and SUCCESS_WITH_WARNINGS are not applicable at the overall
            status level.

            '
        upgrade_steps:
          type: array
          title: Upgrade Step Execution Status
          description: 'Ordered sequence of all upgrade steps with their individual
            execution status

            and messages. Each entry combines the step definition with real-time execution

            state. Steps are listed in the order they are executed.


            Monitor individual steps to track upgrade progress through the workflow,

            identify which step is currently executing, determine which step failed
            if

            upgrade fails, review progress messages for long-running steps, and understand

            the upgrade workflow structure.


            Steps generally execute in the order listed. Some steps may execute in
            parallel

            based on internal orchestration.

            '
          items:
            $ref: '#/components/schemas/SspUpgradeStepStatus'
        pre_checks_status:
          $ref: '#/components/schemas/SspUpgradePreChecksStatus'
          title: Pre-Checks Status
          description: 'Aggregated status of all pre-checks validations. This field
            provides

            the results of pre-upgrade validation checks, including overall

            pre-checks status and detailed results for each individual pre-check.


            This field is present when pre-checks have been executed, either

            standalone via POST /upgrade?pre_checks_only=true or as part of

            a full upgrade via POST /upgrade.

            '
          nullable: true
      additionalProperties: false
    UpgradeAvailableVersions:
      title: Available Upgrade Versions
      description: The currently deployed SSP version and versions available for upgrade.
      type: object
      required:
      - current_version
      - versions_for_upgrade
      properties:
        current_version:
          title: Current Version
          description: The currently deployed SSP version.
          type: string
        versions_for_upgrade:
          title: Versions For Upgrade
          description: 'List of available upgrade version strings greater than the
            currently deployed

            version, sorted in descending order. Empty if no newer versions are available.

            '
          type: array
          items:
            type: string
    UpgradeHistoryListResult:
      title: Upgrade History List
      description: A list of SSP upgrade history records.
      type: object
      required:
      - results
      properties:
        results:
          title: Upgrade History Results
          description: List of SSP upgrade history records, one per upgrade attempt.
          type: array
          items:
            $ref: '#/components/schemas/UpgradeHistoryRecord'
    UpgradeHistoryRecord:
      title: Upgrade History Record
      description: 'Records the metadata for a single SSP upgrade attempt, including
        versions involved,

        final status, and start/end timing.

        '
      type: object
      properties:
        from_version:
          title: From Version
          description: The SSP version from which the upgrade was initiated.
          type: string
        target_version:
          title: Target Version
          description: The SSP version that was the upgrade target.
          type: string
        status:
          title: Upgrade Status
          description: The final status of the upgrade attempt.
          type: string
          enum:
          - IN_PROGRESS
          - FAILED
          - SUCCESS
          - ORPHANED
        start_time:
          $ref: '#/components/schemas/EpochMsTimestamp'
          title: Start Time
          description: Epoch timestamp (milliseconds) representing when the upgrade
            started.
        end_time:
          $ref: '#/components/schemas/EpochMsTimestamp'
          title: End Time
          description: Epoch timestamp (milliseconds) representing when the upgrade
            ended.
    UpgradeAction:
      title: Upgrade Action
      description: 'The upgrade action to perform.

        '
      type: string
      enum:
      - PRECHECKS_ONLY
      - START
      - CONTINUE
      - RETRY
    BaseUpgradeStatus:
      title: Base Status
      description: Execution state of an operation.
      type: string
      readOnly: true
      enum:
      - NOT_STARTED
      - IN_PROGRESS
      - SUCCESS
      - SUCCESS_WITH_WARNINGS
      - FAILED
      - SKIPPED
      - PAUSED
    BaseUpgradeStatusMessage:
      type: object
      title: Base Status Message
      description: 'Individual status message providing feedback about step execution.
        Messages

        are categorized by severity and provide human-readable information for operators.

        '
      required:
      - severity
      - message
      properties:
        severity:
          type: string
          enum:
          - INFO
          - WARNING
          - ERROR
          title: Message Severity
          description: 'Severity level indicating the importance and type of the message.


            INFO represents informational messages about normal progress or milestones.


            WARNING represents non-critical issues that do not prevent step completion

            but should be reviewed.


            ERROR represents critical issues that prevent step completion or indicate

            failure.

            '
        message:
          type: string
          title: Message Text
          description: 'Human-readable message text providing specific information
            about the step''s

            progress, warnings, or errors.

            '
    BaseUpgradeStepStatus:
      title: Base Step Status
      description: 'Base schema containing status-related fields for tracking execution
        state of

        steps. This schema provides standardized status reporting with detailed

        messages and execution timestamps.

        '
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/BaseUpgradeStatus'
          title: Execution Status
          description: Current execution state of the step.
        messages:
          type: array
          title: Status Messages
          description: 'Ordered list of status messages generated during execution.
            Messages provide

            real-time feedback including progress updates, warnings about non-critical

            issues, and errors describing failures.

            '
          items:
            $ref: '#/components/schemas/BaseUpgradeStatusMessage'
        last_run_time:
          $ref: '#/components/schemas/EpochMsTimestamp'
          title: Last Execution Time
          description: 'Timestamp in milliseconds since Unix epoch (January 1, 1970
            00:00:00 UTC)

            indicating when this step was last executed. This field is only present

            after the step has been executed at least once. It will be absent for

            steps in NOT_STARTED state.

            '
          readOnly: true
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: Precondition Failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionRequired:
      description: Precondition Required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
