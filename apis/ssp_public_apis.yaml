paths:
  /ssp/alarms/definitions:
    post:
      tags:
      - alarms
      summary: Get and filter Alarm Definitions
      operationId: FilterAlarmDefinitions
      description: 'Retrieves a list of alarm definitions based on specified filter
        criteria. This endpoint supports filtering by feature names,

        severities, event types, and enabled status. The response includes detailed
        information about each matching alarm definition.

        '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmDefinitionFilterRequest'
      responses:
        '200':
          description: 'Successfully retrieved the list of alarm definitions matching
            the specified filter criteria.

            Returns a paginated list of alarm definitions, including their configuration
            details,

            severity levels, and associated metadata.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmDefinitionListResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - enterprise_admin: []
      - auditor: []
      - security_engineer: []
      - security_op: []
      - license_admin: []
      - license_auditor: []
  /ssp/alarms/definitions/{id}:
    get:
      tags:
      - alarms
      description: 'Retrieves a single alarm definition using its unique identifier.
        Returns detailed configuration

        information about the alarm definition including its feature name, event type,
        severity,

        and other associated metadata.

        '
      summary: Retrieve a specific alarm definition by ID
      operationId: GetAlarmDefinitionsById
      parameters:
      - $ref: '#/components/parameters/AlarmDefinitionIdRequestParam'
      responses:
        '200':
          description: 'Successfully retrieved the requested alarm definition by its
            ID. Returns the complete

            configuration of the alarm definition, including its feature name, event
            type,

            severity level, and all associated metadata.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmDefinitionListResult'
        '404':
          description: 'The specified alarm definition ID was not found in the system.
            This may occur if

            the ID is incorrect or if the alarm definition has been deleted.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - enterprise_admin: []
      - auditor: []
      - security_engineer: []
      - security_op: []
      - license_admin: []
      - license_auditor: []
    post:
      tags:
      - alarms
      summary: Update Alarm Definition
      description: 'Update Alarm Definition

        '
      operationId: UpdateAlarmDefinition
      parameters:
      - $ref: '#/components/parameters/AlarmDefinitionIdRequestParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlarmDefinitionRequest'
      responses:
        '204':
          description: 'The alarm definition was successfully updated with the provided
            changes.

            The update has been applied and the new configuration is now active.

            '
        '404':
          description: 'The alarm definition to be updated was not found. This may
            occur if the ID is incorrect

            or if the alarm definition has been deleted. Verify the ID and try again.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - enterprise_admin: []
      - security_engineer: []
      - license_admin: []
  /ssp/alarms:
    post:
      tags:
      - alarms
      summary: Get and filter alarm instances
      operationId: FilterAlarmInstances
      description: 'Get alarm instances based on filter criteria

        '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmInstanceFilterRequest'
      responses:
        '200':
          description: 'Successfully retrieved the list of alarm instances matching
            the specified filter criteria.

            Returns a paginated list of alarm instances, including their current state,
            severity,

            and associated metadata. The results can be filtered by various attributes
            such as

            severity, feature name, and time range.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmInstanceListResult'
        '500':
          description: 'An unexpected error occurred while processing the request.
            This may be due to

            internal system issues or invalid request parameters. Check the error
            response

            for details about the specific problem.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - enterprise_admin: []
      - auditor: []
      - security_engineer: []
      - security_op: []
      - license_admin: []
      - license_auditor: []
  /ssp/alarms/states:
    post:
      tags:
      - alarms
      summary: Update the state of alarm instances by IDs
      operationId: UpdateAlarmInstancesStates
      description: 'Update the states of a list of alarm instances by IDs

        '
      parameters:
      - $ref: '#/components/parameters/UpdateStateRequestParam'
      - $ref: '#/components/parameters/AlarmSuppressDurationRequestParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlarmInstancesRequest'
      responses:
        '204':
          description: 'The state of all specified alarm instances has been successfully
            updated.

            The new state has been applied to each alarm instance in the request,

            and any associated metadata (like suppression duration) has been recorded.

            '
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - enterprise_admin: []
      - security_engineer: []
      - security_op: []
      - license_admin: []
  /ssp/alarms/{id}:
    get:
      tags:
      - alarms
      summary: Get an alarm instance by ID
      operationId: GetAlarmInstanceById
      description: 'Retrieves a single alarm instance using its unique identifier

        '
      parameters:
      - $ref: '#/components/parameters/AlarmInstanceIdRequestParam'
      responses:
        '200':
          description: 'Successfully retrieved the requested alarm instance by its
            ID. Returns detailed

            information about the alarm instance, including its current state, severity,

            associated resource details, and state transition history.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmInstance'
        '400':
          description: 'The request was invalid. This typically occurs when the provided
            alarm instance ID

            is not in the correct format. Verify that the ID is properly formatted
            and try again.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'The specified alarm instance ID was not found in the system.
            This may occur if

            the ID is incorrect or if the alarm instance has been deleted or archived.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - enterprise_admin: []
      - auditor: []
      - security_engineer: []
      - security_op: []
      - license_admin: []
      - license_auditor: []
  /ssp/alarms/counts:
    post:
      tags:
      - alarms
      summary: Get the alarm counts by severity and feature
      description: 'When invoking this API, the Alarm instances are accounted for
        in a map

        where the key is a category, by default feature name, and the value contains

        counts by severity.

        When the optional FeatureName request parameter is specified, the resulting

        list will only include the feature names passed along with the instance counts

        by severity for those features.

        '
      operationId: GetAlarmCountsByCategoryAndSeverity
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmInstanceCountFilterRequest'
      responses:
        '200':
          description: 'Successfully retrieved alarm instance counts grouped by the
            requested criteria.

            Returns counts of alarm instances broken down by severity and category
            (feature

            or event type), including separate counts for open, suppressed, resolved,
            and

            acknowledged states.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmCounts'
        '400':
          description: 'The request was invalid. This typically occurs when the filter
            criteria are

            malformed or contain invalid values. Check the error response for details
            about

            which parameters were invalid.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'No alarm instances were found matching the specified filter
            criteria. This may

            indicate that there are no alarms in the system for the requested time
            period,

            features, or other filter parameters.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - enterprise_admin: []
      - auditor: []
      - security_engineer: []
      - security_op: []
      - license_admin: []
      - license_auditor: []
  /ssp/backup/config:
    get:
      tags:
      - backup-restore
      summary: Get backup configuration
      operationId: GetBackupConfig
      description: Returns saved remote backup server (SFTP) settings used by Backup
        and Restore. 204 if none configured.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupConfig'
        '204':
          description: No content, backup not configured
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
      - security_engineer: []
      - security_op: []
    put:
      tags:
      - backup-restore
      summary: Update backup configuration
      operationId: UpdateBackupConfig
      description: Saves remote backup server settings; include current _revision
        from GET when updating.
      requestBody:
        required: true
        description: Backup configuration to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupConfig'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
  /ssp/backup/recurring/config:
    get:
      tags:
      - backup-restore
      summary: Get recurring backup configuration
      operationId: GetRecurringBackupConfig
      description: Returns scheduled (recurring) backup policy. 204 if not configured.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringBackupConfig'
        '204':
          description: No content, recurring backup not configured
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
      - security_engineer: []
      - security_op: []
    put:
      tags:
      - backup-restore
      summary: Update recurring backup configuration
      operationId: UpdateRecurringBackupConfig
      description: Saves scheduled backup policy; set weekly or interval fields to
        match backup_schedule_type.
      requestBody:
        required: true
        description: Request to configure automated backups
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringBackupConfig'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringBackupConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
  /ssp/backup:
    post:
      tags:
      - backup-restore
      summary: Start backup
      operationId: StartBackup
      description: Starts an on-demand backup; poll GET /backup/status/{id} using
        the id from the 202 response.
      requestBody:
        required: true
        description: Request to start backup
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupRequest'
            example:
              backup_type: FULL_BACKUP
              action: BACKUP
              name: Manual backup
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
  /ssp/backup/status/{id}:
    get:
      tags:
      - backup-restore
      summary: Get backup status
      operationId: GetBackupStatus
      description: Returns one backup job by id (from POST /backup or GET /backup/status).
      parameters:
      - name: id
        required: true
        in: path
        description: Backup job id returned by POST /backup or listed in history.
        example: abcde
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupStatus'
        '404':
          description: Backup not found for provided id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
      - security_engineer: []
      - security_op: []
  /ssp/backup/status:
    get:
      tags:
      - backup-restore
      summary: Get backup status history
      operationId: GetBackupStatusHistory
      description: 'Returns the backup status history.  Results are always returned
        in chronologically

        reverse order, i.e., the latest backup status first.  To get the latest backup

        status, set the page size to 1 without other query parameter.  If there''s
        no latest

        backup, then the call returns an empty list.

        '
      parameters:
      - name: status
        in: query
        description: Backup status.
        example: SUCCESS
        schema:
          type: array
          items:
            $ref: '#/components/schemas/BackupRestoreStatus'
      - name: history_type
        in: query
        description: History type.  If not specified, default to DB
        example: SERVER
        schema:
          $ref: '#/components/schemas/BackupHistoryType'
      - name: trigger_type
        in: query
        description: Backup trigger type.
        example: MANUAL
        schema:
          $ref: '#/components/schemas/BackupTriggerType'
      - name: backup_id
        in: query
        description: Use this request param to filter results by backup_id.
        example: abcde
        schema:
          type: string
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupStatusList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
      - security_engineer: []
      - security_op: []
  /ssp/restore:
    post:
      tags:
      - backup-restore
      summary: Start restore
      operationId: StartRestore
      description: Starts restore from backup_id; poll GET /restore/status/{id} using
        the id from the 202 response.
      requestBody:
        required: true
        description: Request to start restore
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
            example:
              backup_id: bak-001
              action: RESTORE
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
  /ssp/restore/status/{id}:
    get:
      tags:
      - backup-restore
      summary: Get restore status
      operationId: GetRestoreStatus
      description: Returns one restore job by id (from POST /restore or GET /restore/status).
      parameters:
      - name: id
        required: true
        in: path
        description: Restore job id from POST /restore or history.
        example: 12345
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreStatus'
        '404':
          description: Restore not found for provided id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
      - security_engineer: []
      - security_op: []
  /ssp/restore/status:
    get:
      tags:
      - backup-restore
      summary: Get restore status history
      operationId: GetRestoreStatusHistory
      description: 'Returns all restore status history.  Results are always returned
        in chronologically

        reverse order, i.e., the latest restore status first.

        '
      parameters:
      - name: status
        in: query
        description: Restore status.
        example: SUCCESS
        schema:
          type: array
          items:
            $ref: '#/components/schemas/BackupRestoreStatus'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreStatusList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - enterprise_admin: []
      - auditor: []
      - security_engineer: []
      - security_op: []
  /ssp/cluster/monitor/feature/health:
    get:
      tags:
      - cluster-monitor
      summary: Retrieve hierarchical feature and component health status
      description: 'Retrieve hierarchical health status: Features -> Services -> Components.


        **Structure:**

        - Features are high-level groupings (e.g., "intelligence", "analytics")

        - Services are feature components (e.g., "cluster-api")

        - Components are pods/deployments


        **Key points:**

        - Overall platform status: `UP`, `PARTIALLY_UP`, `DOWN`

        - Aggregated from feature status

        - See API guide for when to use this vs other endpoints

        '
      operationId: GetFeatureHealth
      responses:
        '200':
          description: Successfully retrieved feature health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorFeatureHealthResponse'
        '400':
