          Deploy the feature to apply the configuration.
    UpgradeCoordinatorConfiguration:
      title: Upgrade Coordinator Feature Deployment Configuration.
      description: 'The feature deployment configuration for Upgrade Coordinator.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/ManagedResource'
      - type: object
        properties:
          target_version:
            title: Target Version for Upgrade Coordinator
            description: 'The target version for the Upgrade Coordinator deployment.

              '
            type: string
        required:
        - target_version
