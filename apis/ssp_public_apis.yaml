- name: feature-lifecycle
  description: "APIs for security services platform feature lifecycle management,\
    \ including pre-checks, deployment, removal, and status read.\n\n**Endpoint Guide:**\n\
    - `PUT /lcm/features/{feature}`\n   - Queue a deployment action (`RUN_PRECHECK`,\
    \ `DEPLOY`, `UNDEPLOY`, `FORCE_UNDEPLOY`).\n   - Returns `202` when the action\
    \ is accepted for async processing.\n- `GET /lcm/features/{feature}`\n   - Read\
    \ the staged deployment resource (`action`, `_revision`) used for optimistic concurrency\
    \ before `PUT`.\n- `GET /lcm/features/{feature}/status`\n   - Read live deployment\
    \ phase, Prechecks aggregate, per-action history, and progress for polling after\
    \ `PUT`.\n\n**Workflow:**\n- `GET /lcm/features/{feature}` to read `_revision`\n\
    - `PUT /lcm/features/{feature}` with `action` and `_revision`\n- Poll `GET /lcm/features/{feature}/status`\
    \ until `overall_status` is terminal\n  - Retain `AsyncApiResponse` identifiers\
    \ from `PUT` when returned for correlation.\n"
