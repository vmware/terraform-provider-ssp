  /ssp/security-content/feature-download-info:
    get:
      summary: Get feature download info for the feature type and feature version
      description: 'Returns the feature download info for the feature type and feature
        version if exists else response with 404

        response code will returned. To get the latest version, pass LATEST for feature_version
        query parameter for

        the feature type.


        If SSP is in disconnected mode (see field CLOUD_CONNECTIVITY_MODE in SecurityContentConfig)
        then the response depends

        on configurations - automatic update and feature version mapping. When automatic
        update configuration takes

        precedence over feature version mapping and returns latest feature version.
        Latest version will be returned

        when both automatic update and feature version mapping is not set. When automatic
        update is disabled and feature

        version mapping is set, then the download info for the mapped version will
        be returned.


        Latest version is determined based on the feature_updated_at timestamp. When
        VTIS provides

        an update timestamp for the feature, that is used as the authoritative sort
        key. When VTIS

        does not provide an update timestamp, the SSP processing time (when the feature
        was ingested)

        is used as a fallback. The feature version with the most recent feature_updated_at
        is returned

        as LATEST.

        '
      operationId: GetFeatureInfoByIdAndVersion
      tags:
      - security-content
      parameters:
      - $ref: '#/components/parameters/FeatureTypeParam'
      - $ref: '#/components/parameters/FeatureVersionParam'
      security:
      - enterprise_admin: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureDownloadInfo'
              example:
                version: '1.0'
                contents:
                - name: IDSP_Signatures_1432.zip
                  sha256_checksum: 3a8456acb858eb7d883caa832a38316dc0f8230e2707ae283d5865e07b1b9277
                  download_url: https://cdn.example.com/bundle.zip?X-key=value
